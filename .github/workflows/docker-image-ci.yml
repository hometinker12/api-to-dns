name: Docker Image CI

on:
  push:
    branches: [ "release" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy env example for testing
        run: cp .env.example .env

      - name: Generate encryption key for testing
        run: |
          python3 -c "
          from cryptography.fernet import Fernet
          key = Fernet.generate_key().decode()
          print(f'ENCRYPTION_KEY={key}')
          " > temp_key.txt
          sed -i "s/ENCRYPTION_KEY=.*/$(cat temp_key.txt)/" .env
          rm temp_key.txt
          echo 'Generated encryption key for testing'

      - name: Build the Docker image
        run: |
          IMAGE_TAG="my-image-name:$(date +%s)"
          docker build . --file Dockerfile --tag "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Run container smoke test
        run: |
          echo "Testing container startup..."
          timeout 10s docker run --rm --name dns-api-test --env-file .env -p 8000:8000 "$IMAGE_TAG" || true
          
          echo "Starting container in background..."
          docker run --rm -d --name dns-api-test --env-file .env -p 8000:8000 "$IMAGE_TAG"
          echo "Container started, waiting for startup..."
          sleep 15
          
          # Check if container is still running
          if ! docker ps | grep -q dns-api-test; then
            echo "Container exited prematurely. Checking recent logs..."
            docker logs dns-api-test 2>/dev/null || echo "No logs available - container may have failed to start"
            exit 1
          fi
          
          echo "Container is running, testing endpoints..."
          curl --fail --max-time 10 http://localhost:8000/login
          curl --fail -L -c /tmp/cookies -X POST http://localhost:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          API_KEY=$(curl --fail -L -b /tmp/cookies -X POST http://localhost:8000/api-keys \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "label=smoke-test" | grep -oP 'API key created: \K[^<]+' )
          echo "Generated API key: $API_KEY"
          if [ -z "$API_KEY" ]; then
            echo "API key generation failed"
            exit 1
          fi
          curl --fail -H "X-API-Key: $API_KEY" http://localhost:8000/keycheck
          docker stop dns-api-test
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
