name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: hometinker12/api-to-dns

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  container-smoke:
    name: Build and smoke-test container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: api-to-dns:smoke-${{ github.sha }}
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,mode=max,scope=container-smoke

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_NAME="api-to-dns-smoke"
          IMAGE_TAG="api-to-dns:smoke-${GITHUB_SHA}"
          ENC_KEY="$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          SESSION_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"

          cleanup() {
            docker logs "$CONTAINER_NAME" 2>/dev/null || true
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            -p 127.0.0.1:8000:8000 \
            -e "ENCRYPTION_KEY=$ENC_KEY" \
            -e "SECRET_KEY=$SESSION_KEY" \
            -e "ADMIN_USER=admin" \
            -e "ADMIN_PASSWORD=container-smoke-password" \
            "$IMAGE_TAG"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "Container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done

          echo "Container health endpoint did not become ready"
          exit 1

  publish:
    name: Build and publish
    needs: container-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid VERSION value: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,mode=max,scope=container-smoke

      - name: Write publication summary
        run: |
          echo "Published \`${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
