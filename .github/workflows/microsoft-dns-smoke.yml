# Tests: pytest on **develop**; BIND and Microsoft DNS smoke tests on **release**.
# - **pytest**: unit tests on ubuntu (`python -m pytest`).
# - **bind-smoke-linux**: checkout on ubuntu, `docker build`, BIND + API in Docker (bash), same idea as release CI.
# - **microsoft-dns-smoke-windows**: install DNS Server on windows-2025, run the API natively with Python/uvicorn,
#   then inline PowerShell (Invoke-WebRequest / Invoke-RestMethod) exercises local + optional remote Microsoft DNS.
#
# Why not `docker build` on the Windows runner: the official Python image **does** publish `linux/amd64`, but a Windows
# daemon without a working Linux backend often fails with **"no matching manifest for linux/amd64"** on pull. WSL2 may
# be present on the image without a usable default distro / Linux Docker context. Running the API natively on Windows
# avoids Linux Docker/WSL for the Microsoft DNS smoke; BIND parity remains covered on Ubuntu.
#
# Optional remote lab secrets: MICROSOFT_DNS_WINRM_HOST, USER, PASSWORD, SSL, QUERY_HOST

name: Pytest + Bind + Microsoft DNS smoke

on:
  push:
    branches:
      - develop
      - release

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  bind-smoke-linux:
    name: BIND and Docker image smoke (ubuntu + Docker)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@v6

      - name: Copy env example for testing
        run: cp .env.example .env

      - name: Generate encryption and session secrets for testing
        run: |
          KEY="$(python - <<'PY'
          import base64
          import os
          import secrets

          print(base64.urlsafe_b64encode(os.urandom(32)).decode())
          print(secrets.token_urlsafe(32))
          PY
          )"
          ENC_KEY="$(printf '%s\n' "$KEY" | sed -n '1p')"
          SECRET="$(printf '%s\n' "$KEY" | sed -n '2p')"
          sed -i.bak "s|ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${ENC_KEY}|" .env
          sed -i.bak "s|SECRET_KEY=.*|SECRET_KEY=${SECRET}|" .env
          rm -f .env.bak
          echo 'Generated encryption and session secrets for testing'

      - name: Build the Docker image
        run: |
          IMAGE_TAG="api-to-dns-bind-smoke:$(date +%s)"
          docker build . --file Dockerfile --tag "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Run BIND-backed smoke test
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          NETWORK_NAME="dns-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BIND_DIR="${RUNNER_TEMP}/bind-smoke"
          TSIG_NAME="api-to-dns."
          TSIG_SECRET="MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

          cleanup() {
            echo "Collecting container logs..."
            docker logs dns-api-test 2>/dev/null || true
            docker logs bind-test 2>/dev/null || true
            docker rm -f dns-api-test bind-test 2>/dev/null || true
            docker network rm "${NETWORK_NAME}" 2>/dev/null || true
          }
          trap cleanup EXIT

          mkdir -p "${BIND_DIR}"
          python3 - "${BIND_DIR}" "${TSIG_NAME}" "${TSIG_SECRET}" <<'PY'
          import sys
          from pathlib import Path

          bind_dir = Path(sys.argv[1])
          tsig_name = sys.argv[2]
          tsig_secret = sys.argv[3]

          named_conf = (
              'key "' + tsig_name + '" {\n'
              "  algorithm hmac-sha256;\n"
              '  secret "' + tsig_secret + '";\n'
              "};\n"
              "\n"
              "options {\n"
              '  directory "/bind";\n'
              "  listen-on port 53 { any; };\n"
              "  listen-on-v6 { none; };\n"
              "  allow-query { any; };\n"
              "  recursion no;\n"
              "  dnssec-validation no;\n"
              "};\n"
              "\n"
              'zone "smoke.test" {\n'
              "  type master;\n"
              '  file "/bind/db.smoke.test";\n'
              '  allow-update { key "' + tsig_name + '"; };\n'
              "};\n"
              "\n"
              'zone "denied.test" {\n'
              "  type master;\n"
              '  file "/bind/db.denied.test";\n'
              '  allow-update { key "' + tsig_name + '"; };\n'
              "};\n"
          )

          zone_smoke = """$TTL 300
          @ IN SOA ns.smoke.test. hostmaster.smoke.test. (
            1 ; serial
            300 ; refresh
            300 ; retry
            300 ; expire
            300 ; minimum
          )
          @ IN NS ns.smoke.test.
          ns IN A 127.0.0.1
          """

          zone_denied = """$TTL 300
          @ IN SOA ns.denied.test. hostmaster.denied.test. (
            1 ; serial
            300 ; refresh
            300 ; retry
            300 ; expire
            300 ; minimum
          )
          @ IN NS ns.denied.test.
          ns IN A 127.0.0.1
          """

          def _unindent(s: str) -> str:
              return "\n".join(line.lstrip() for line in s.splitlines()).strip() + "\n"

          (bind_dir / "named.conf").write_text(_unindent(named_conf), newline="\n")
          (bind_dir / "db.smoke.test").write_text(_unindent(zone_smoke), newline="\n")
          (bind_dir / "db.denied.test").write_text(_unindent(zone_denied), newline="\n")
          PY

          chmod -R a+rwX "${BIND_DIR}"
          docker network create "${NETWORK_NAME}"

          docker run -d --name bind-test --network "${NETWORK_NAME}" \
            -e BIND9_USER=root \
            -v "${BIND_DIR}:/bind:rw" \
            ubuntu/bind9:9.18-22.04_edge \
            -c /bind/named.conf

          for i in $(seq 1 60); do
            if docker exec bind-test ss -lun 2>/dev/null | grep -q ':53'; then
              break
            fi
            if [ -z "$(docker ps -q -f name=bind-test -f status=running)" ]; then
              echo "BIND container exited before becoming ready"
              docker logs bind-test 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          if ! docker exec bind-test ss -lun 2>/dev/null | grep -q ':53'; then
            echo "BIND did not open port 53 in time"
            docker logs bind-test 2>&1 | tail -n 200 || true
            exit 1
          fi

          docker exec bind-test bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -qq -y dnsutils'

          for i in $(seq 1 30); do
            if docker exec bind-test dig @127.0.0.1 smoke.test SOA +short >/tmp/bind-soa.txt 2>/dev/null && [ -s /tmp/bind-soa.txt ]; then
              break
            fi
            if [ -z "$(docker ps -q -f name=bind-test -f status=running)" ]; then
              echo "BIND container exited during dnsutils install or query wait"
              docker logs bind-test 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          if [ ! -s /tmp/bind-soa.txt ]; then
            echo "dig did not return SOA for smoke.test"
            docker logs bind-test 2>&1 | tail -n 200 || true
            exit 1
          fi

          # Image USER default must be non-root even without an explicit --user override.
          DEFAULT_IMAGE_USER="$(docker run --rm --entrypoint id "$IMAGE_TAG" -u)"
          if [ "${DEFAULT_IMAGE_USER}" = "0" ]; then
            echo "Image default USER is root; Dockerfile must set USER app (10001)"
            exit 1
          fi

          docker run -d --name dns-api-test --network "${NETWORK_NAME}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64M,mode=1777 \
            --tmpfs /app/data:size=64M,uid=10001,gid=10001,mode=1755 \
            --tmpfs /app/logs:size=16M,uid=10001,gid=10001,mode=1755 \
            --env-file .env \
            -e RATE_LIMIT_LOGIN=3:8 \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE_TAG"

          UID_IN_CONTAINER="$(docker exec dns-api-test id -u)"
          if [ "$UID_IN_CONTAINER" = "0" ]; then
            echo "API container process is running as root"
            exit 1
          fi

          for i in $(seq 1 60); do
            # Probe /health (not /login) so readiness checks do not consume RATE_LIMIT_LOGIN.
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ -z "$(docker ps -q -f name=dns-api-test -f status=running)" ]; then
              echo "API container exited before becoming ready"
              exit 1
            fi
            sleep 2
          done

          echo "[bind] Security defaults: OpenAPI/docs off, headers, CSRF, logout method"
          for path in /openapi.json /docs /redoc; do
            code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${path}")"
            if [ "${code}" != "404" ]; then
              echo "Expected ${path} to return 404 when OPENAPI_ENABLED is unset; got ${code}"
              exit 1
            fi
          done
          curl --fail --silent -D /tmp/health-headers -o /dev/null http://127.0.0.1:8000/health
          python3 - <<'PY'
          from pathlib import Path
          headers = Path("/tmp/health-headers").read_text(encoding="utf-8", errors="replace").lower()
          for name in (
              "x-content-type-options: nosniff",
              "x-frame-options: deny",
              "referrer-policy: same-origin",
              "content-security-policy:",
          ):
              assert name in headers, f"missing security header: {name}\n{headers}"
          PY
          logout_get_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/logout)"
          if [ "${logout_get_code}" != "405" ]; then
            echo "Expected GET /logout to return 405; got ${logout_get_code}"
            exit 1
          fi

          echo "[bind] Login rate limit (RATE_LIMIT_LOGIN=3:8) before other /login probes"
          for i in $(seq 1 4); do
            rl_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/login \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Origin: http://127.0.0.1:8000" \
              -H "Referer: http://127.0.0.1:8000/login" \
              -d "username=nobody&password=wrong-password")"
            if [ "${i}" -le 3 ] && [ "${rl_code}" = "429" ]; then
              echo "Login rate-limited too early on attempt ${i}"
              exit 1
            fi
            if [ "${i}" -eq 4 ] && [ "${rl_code}" != "429" ]; then
              echo "Expected 429 on 4th login attempt; got ${rl_code}"
              exit 1
            fi
          done
          # Wait for the short login window to expire before CSRF + real login.
          sleep 9

          csrf_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: https://evil.example" \
            -d "username=admin&password=your-admin-password")"
          if [ "${csrf_code}" != "403" ]; then
            echo "Expected cross-origin login POST to return 403; got ${csrf_code}"
            exit 1
          fi

          echo "[bind] Login as admin"
          curl --fail --silent -c /tmp/cookies -D /tmp/login-headers -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          python3 - <<'PY'
          from pathlib import Path
          headers = Path("/tmp/login-headers").read_text(encoding="utf-8", errors="replace")
          assert "set-cookie:" in headers.lower(), headers
          # HTTP smoke has no TLS; Secure cookie must not be forced unless SESSION_COOKIE_SECURE=1.
          cookie_lines = [line for line in headers.splitlines() if line.lower().startswith("set-cookie:")]
          assert cookie_lines, headers
          assert all("secure" not in line.lower() for line in cookie_lines), cookie_lines
          PY
          echo "[bind] Verify admin page"
          curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/admin | python3 -c "import sys; assert 'api-to-dns App Dashboard' in sys.stdin.read()"

          echo "[bind] POST logout clears session"
          curl --fail --silent -b /tmp/cookies -c /tmp/cookies -X POST http://127.0.0.1:8000/logout \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/admin" \
            -o /dev/null
          admin_after_logout="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -b /tmp/cookies http://127.0.0.1:8000/admin)"
          if [ "${admin_after_logout}" != "303" ] && [ "${admin_after_logout}" != "401" ] && [ "${admin_after_logout}" != "302" ]; then
            # Unauthenticated browser /admin redirects to /login (303) via exception handler.
            echo "Expected unauthenticated /admin after logout; got ${admin_after_logout}"
            exit 1
          fi
          curl --fail --silent -c /tmp/cookies -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null

          for zone in smoke.test denied.test; do
            echo "[bind] Configure zone ${zone}"
            zone_body="/tmp/zone-create-${zone}.html"
            zone_status="$(curl --silent --show-error -b /tmp/cookies -X POST http://127.0.0.1:8000/zones \
              -w "%{http_code}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Origin: http://127.0.0.1:8000" \
              -H "Referer: http://127.0.0.1:8000/zones" \
              --data-urlencode "zone_name=${zone}" \
              --data-urlencode "dns_zone=${zone}" \
              --data-urlencode "dns_provider_type=bind" \
              --data-urlencode "dns_server=bind-test" \
              --data-urlencode "dns_username=${TSIG_NAME}" \
              --data-urlencode "dns_password=${TSIG_SECRET}" \
              --data-urlencode "dns_tsig_algorithm=hmac-sha256" \
              -o "${zone_body}")"
            if [ "${zone_status}" != "200" ] || ! { grep -q "Zone '${zone}' added" "${zone_body}" || grep -q "Zone &#39;${zone}&#39; added" "${zone_body}"; }; then
              echo "[bind] Zone create assertion failed for ${zone}; response excerpt:"
              python3 -c 'import sys; from pathlib import Path; print(Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")[:1200])' "${zone_body}"
              exit 1
            fi
          done

          echo "[bind] Fetch API key management page"
          curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/api-keys -o /tmp/api-keys.html
          SMOKE_ZONE_ID="$(python3 -c 'import re; html=open("/tmp/api-keys.html", encoding="utf-8").read(); match=re.search(r"name=\"zone_ids\" value=\"(\d+)\"\s*/>\s*<code>smoke\.test</code>", html, re.DOTALL); assert match, "Could not find smoke.test zone ID"; print(match.group(1))')"
          : "${SMOKE_ZONE_ID:?Could not extract smoke.test zone ID}"

          echo "[bind] Create API key for smoke.test"
          curl --fail --silent -L -b /tmp/cookies -X POST http://127.0.0.1:8000/api-keys \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/api-keys" \
            --data-urlencode "label=bind-smoke-test" \
            --data-urlencode "zone_ids=${SMOKE_ZONE_ID}" \
            -o /tmp/api-key-create.html

          API_KEY="$(python3 -c 'import re; html=open("/tmp/api-key-create.html", encoding="utf-8").read(); match=re.search(r"data-created-api-key=\"([^\"]+)\"", html) or re.search(r"API key created:\s*([^<\s]+)", html); assert match, "Could not extract API key"; print(match.group(1))')"
          : "${API_KEY:?Could not extract API key}"

          echo "[bind] Validate API key with /keycheck"
          curl --fail --silent -H "X-API-Key: $API_KEY" http://127.0.0.1:8000/keycheck \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['status'] == 'success'"

          call_dns_api() {
            local method="$1"
            local expected_status="$2"
            local expected_action="$3"
            local request_uri="$4"
            local body="$5"
            local output="/tmp/dns-response-${expected_action}.json"
            local status

            local curl_args=(
              --silent --show-error -o "${output}" -w "%{http_code}"
              -X "${method}"
              "${request_uri}"
              -H "X-API-Key: ${API_KEY}"
            )
            if [ -n "${body}" ]; then
              curl_args+=( -H "Content-Type: application/json" -d "${body}" )
            fi
            status="$(curl "${curl_args[@]}")"

            echo "[bind] ${method} ${expected_action}: HTTP ${status}"
            cat "${output}"
            echo

            if [ "${status}" != "${expected_status}" ]; then
              echo "Expected HTTP ${expected_status}, got ${status}"
              exit 1
            fi

            python3 -c "import json,sys;b=json.load(open(sys.argv[1],encoding='utf-8'));e=sys.argv[2];assert((e=='access_denied' and b['detail']['error']=='access_denied') or (b['action']==e)),b" "${output}" "${expected_action}"
          }

          wait_for_record_value() {
            local fqdn="$1"
            local expected="$2"
            local value=""
            for i in $(seq 1 20); do
              value="$(docker exec bind-test dig @127.0.0.1 "${fqdn}" A +short | tr -d '\r' | tail -n 1 || true)"
              if [ "${value}" = "${expected}" ]; then
                return 0
              fi
              sleep 1
            done
            echo "Expected ${fqdn} to resolve to ${expected}; got '${value}'"
            exit 1
          }

          wait_for_record_absent() {
            local fqdn="$1"
            local value=""
            for i in $(seq 1 20); do
              value="$(docker exec bind-test dig @127.0.0.1 "${fqdn}" A +short | tr -d '\r' || true)"
              if [ -z "${value}" ]; then
                return 0
              fi
              sleep 1
            done
            echo "Expected ${fqdn} to be absent; got '${value}'"
            exit 1
          }

          DNS_RECORD_URL='http://127.0.0.1:8000/dns-record'
          DELETE_SMOKE_URL='http://127.0.0.1:8000/dns-record?zone_name=smoke.test&record_name=www&record_type=A'

          call_dns_api POST 200 created "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.10"]}'
          wait_for_record_value www.smoke.test 192.0.2.10
          call_dns_api PATCH 200 updated "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":450}'
          wait_for_record_value www.smoke.test 192.0.2.10
          call_dns_api POST 409 record_already_exists "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.10"]}'
          call_dns_api PUT 200 updated "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.20"]}'
          wait_for_record_value www.smoke.test 192.0.2.20
          call_dns_api PATCH 200 updated "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","values":["192.0.2.30"]}'
          wait_for_record_value www.smoke.test 192.0.2.30
          call_dns_api DELETE 200 deleted "${DELETE_SMOKE_URL}" ''
          wait_for_record_absent www.smoke.test
          call_dns_api DELETE 404 not_found "${DELETE_SMOKE_URL}" ''
          call_dns_api PUT 404 not_found "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.40"]}'
          call_dns_api POST 403 access_denied "${DNS_RECORD_URL}" '{"zone_name":"denied.test","record_type":"A","record_name":"blocked","ttl":300,"values":["192.0.2.55"]}'

          echo "[compose] Validate hardened Compose config and startup against the smoke image"
          docker tag "${IMAGE_TAG}" hometinker12/api-to-dns:0.6.0
          python3 - <<'PY'
          import json
          import subprocess

          cfg = json.loads(subprocess.check_output(["docker", "compose", "config", "--format", "json"], text=True))
          svc = cfg["services"]["dns-api"]
          assert str(svc.get("user") or "") in {"10001:10001", "10001"}, svc.get("user")
          assert svc.get("read_only") is True, svc
          cap_drop = {str(item).upper() for item in (svc.get("cap_drop") or [])}
          assert "ALL" in cap_drop, cap_drop
          security_opt = [str(item) for item in (svc.get("security_opt") or [])]
          assert any("no-new-privileges" in item for item in security_opt), security_opt
          ports = svc.get("ports") or []

          def _has_mapping(published: str, target: int) -> bool:
              return any(
                  isinstance(port, dict)
                  and str(port.get("published")) == published
                  and int(port.get("target") or 0) == target
                  # host_ip may be omitted (all interfaces) or set to 127.0.0.1
                  and str(port.get("host_ip") or "") in {"", "0.0.0.0", "127.0.0.1"}
                  for port in ports
              )

          assert _has_mapping("8001", 8000), ports
          assert _has_mapping("8443", 8443), ports
          targets = {
              volume.get("target")
              for volume in (svc.get("volumes") or [])
              if isinstance(volume, dict)
          }
          assert {"/app/data", "/app/data/ssl", "/app/logs"} <= targets, targets
          print("compose config hardening assertions passed")
          PY
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8001/health >/dev/null
          COMPOSE_UID="$(docker compose exec -T dns-api id -u | tr -d '\r')"
          if [ "${COMPOSE_UID}" = "0" ]; then
            echo "Compose service process is running as root"
            docker compose logs dns-api || true
            docker compose down -v --remove-orphans || true
            exit 1
          fi
          curl --fail --silent -c /tmp/compose-cookies -X POST http://127.0.0.1:8001/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8001" \
            -H "Referer: http://127.0.0.1:8001/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          curl --fail --silent -b /tmp/compose-cookies http://127.0.0.1:8001/admin \
            | python3 -c "import sys; assert 'api-to-dns App Dashboard' in sys.stdin.read()"
          docker compose down -v --remove-orphans

          echo "BIND smoke on Linux completed successfully."

  microsoft-dns-smoke-windows:
    name: Local Microsoft DNS WinRM smoke (windows, native API + PowerShell)
    runs-on: windows-2025
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Microsoft DNS on runner and prepare local WinRM test user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Installing DNS Server role...'
          Install-WindowsFeature -Name DNS -IncludeManagementTools | Out-Null

          Write-Host 'Enabling WinRM / PS remoting...'
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          winrm quickconfig -quiet -force

          # Required so a non-built-in local admin / DnsAdmins member gets a full token
          # over the network. Without this WSMan returns w:AccessDenied (wsmanfault 5)
          # even when NTLM auth itself succeeds.
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
            -Name LocalAccountTokenFilterPolicy -PropertyType DWord -Value 1 -Force | Out-Null

          # NTLM to 127.0.0.1 from a non-domain client requires TrustedHosts.
          Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value '127.0.0.1,localhost' -Force

          # KB 896861: disable NTLM loopback check (anti-reflection) so NTLM auth
          # to 127.0.0.1 / localhost / non-canonical names does not fail with
          # AccessDenied (wsmanfault 5). Required when the URL hostname differs
          # from the machine's actual NetBIOS name.
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
            -Name DisableLoopbackCheck -PropertyType DWord -Value 1 -Force | Out-Null

          Restart-Service WinRM

          $userName = 'gh-dns-smoke'
          Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          $plain = -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 28 | ForEach-Object { [char]$_ })
          $sec = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $userName -Password $sec -AccountNeverExpires -PasswordNeverExpires `
            -UserMayNotChangePassword -ErrorAction Stop
          foreach ($g in @('DnsAdmins', 'DNSAdmins')) {
            $lg = Get-LocalGroup -Name $g -ErrorAction SilentlyContinue
            if ($lg) {
              Add-LocalGroupMember -Group $g -Member $userName -ErrorAction Stop
              break
            }
          }
          Add-LocalGroupMember -Group 'Remote Management Users' -Member $userName -ErrorAction Stop
          # pywinrm calls the WS-Man Shell URI; its RootSDDL only grants
          # BUILTIN\Administrators by default. Remote Management Users covers
          # the PSRemoting endpoint but not the raw Shell endpoint. Add the
          # ephemeral CI user to Administrators so it can create a shell.
          # LocalAccountTokenFilterPolicy=1 ensures it gets a full token.
          Add-LocalGroupMember -Group 'Administrators' -Member $userName -ErrorAction SilentlyContinue

          Import-Module DnsServer
          foreach ($z in @('local-smoke.test', 'local-denied.test')) {
            if (Get-DnsServerZone -Name $z -ErrorAction SilentlyContinue) {
              Remove-DnsServerZone -Name $z -Force
            }
            Add-DnsServerPrimaryZone -Name $z -ZoneFile "$z.dns" -ErrorAction Stop
          }

          # #region agent diagnostics (keep until WinRM smoke is confirmed green)
          Write-Host '--- WinRM diagnostics ---'
          $tokenPolicy = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue).LocalAccountTokenFilterPolicy
          Write-Host "LocalAccountTokenFilterPolicy = $tokenPolicy"
          Write-Host "TrustedHosts = $((Get-Item WSMan:\localhost\Client\TrustedHosts).Value)"
          Write-Host "WinRM service status = $((Get-Service WinRM).Status)"
          (Get-LocalGroupMember -Group 'Remote Management Users' -ErrorAction SilentlyContinue) | ForEach-Object { Write-Host "RemoteMgmt member: $($_.Name)" }
          (Get-LocalGroupMember -Group 'DnsAdmins' -ErrorAction SilentlyContinue) | ForEach-Object { Write-Host "DnsAdmins member: $($_.Name)" }
          (Get-LocalGroupMember -Group 'Administrators' -ErrorAction SilentlyContinue) | ForEach-Object { Write-Host "Administrators member: $($_.Name)" }
          try { Test-WSMan -ComputerName 127.0.0.1 -ErrorAction Stop | Out-Null; Write-Host 'Test-WSMan 127.0.0.1: OK' } catch { Write-Host "Test-WSMan 127.0.0.1 failed: $($_.Exception.Message)" }
          # Authenticated PSRemoting probe with the same creds pywinrm will use.
          # If this prints the user, NTLM auth + WinRM shell creation work; any
          # subsequent failure must be in pywinrm transport or DNS cmdlet rights.
          try {
            $probeCred = New-Object System.Management.Automation.PSCredential(("$($env:COMPUTERNAME)\$userName"), $sec)
            $who = Invoke-Command -ComputerName $env:COMPUTERNAME -Credential $probeCred -Authentication Negotiate -ScriptBlock { whoami } -ErrorAction Stop
            Write-Host "Invoke-Command (as gh-dns-smoke) whoami: $who"
          } catch {
            Write-Host "Invoke-Command (as gh-dns-smoke) failed: $($_.Exception.Message)"
          }
          # #endregion agent diagnostics

          Write-Output "::add-mask::$plain"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_WINRM_USER=$userName"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_WINRM_PASSWORD=$plain"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_ALLOWED_ZONE=local-smoke.test"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_DENIED_ZONE=local-denied.test"

      - name: Prepare .env with Fernet encryption and session secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Force .env.example .env
          $key = (& python -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())").Trim()
          $secret = (& python -c "import secrets; print(secrets.token_urlsafe(32))").Trim()
          $text = (Get-Content .env -Raw) -replace 'ENCRYPTION_KEY=.*', "ENCRYPTION_KEY=$key"
          $text = $text -replace 'SECRET_KEY=.*', "SECRET_KEY=$secret"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) '.env'), $text, $utf8)

      - name: Microsoft smoke (PowerShell HTTP + native API)
        shell: pwsh
        env:
          REMOTE_WINRM_HOST: ${{ secrets.MICROSOFT_DNS_WINRM_HOST }}
          REMOTE_WINRM_USER: ${{ secrets.MICROSOFT_DNS_WINRM_USER }}
          REMOTE_WINRM_PASSWORD: ${{ secrets.MICROSOFT_DNS_WINRM_PASSWORD }}
          REMOTE_WINRM_SSL: ${{ secrets.MICROSOFT_DNS_WINRM_SSL }}
          REMOTE_QUERY_HOST: ${{ secrets.MICROSOFT_DNS_QUERY_HOST }}
          REMOTE_ALLOWED_ZONE: smoke.ms.lab
          REMOTE_DENIED_ZONE: denied.ms.lab
          INPUT_QUERY_SERVER: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          Set-Location $workspace

          $base = 'http://127.0.0.1:8000'
          $apiProcess = $null
          $apiOut = Join-Path $env:RUNNER_TEMP 'api-to-dns-uvicorn.out.log'
          $apiErr = Join-Path $env:RUNNER_TEMP 'api-to-dns-uvicorn.err.log'

          function Wait-LoginPage {
            param([int]$MaxAttempts = 60)
            for ($i = 0; $i -lt $MaxAttempts; $i++) {
              try {
                $null = Invoke-WebRequest -Uri "$base/login" -UseBasicParsing -TimeoutSec 5
                return
              }
              catch { Start-Sleep -Seconds 2 }
            }
            throw 'API did not become ready on :8000/login'
          }

          function Invoke-FormPost {
            param(
              [Parameter(Mandatory)] [string] $Uri,
              $WebSession,
              [Parameter(Mandatory)] [hashtable] $Form,
              [int] $MaximumRedirection = 10
            )
            $pairs = $Form.GetEnumerator() | ForEach-Object {
              '{0}={1}' -f $_.Key, [uri]::EscapeDataString([string]$_.Value)
            }
            $body = $pairs -join '&'
            # Same-origin CSRF checks require Origin/Referer to match Host.
            $uriObj = [uri]$Uri
            $origin = '{0}://{1}' -f $uriObj.Scheme, $uriObj.Authority
            return Invoke-WebRequest -Uri $Uri -WebSession $WebSession -Method Post -Body $body `
              -ContentType 'application/x-www-form-urlencoded' -UseBasicParsing -MaximumRedirection $MaximumRedirection -SkipHttpErrorCheck `
              -Headers @{ Origin = $origin; Referer = $Uri }
          }

          function Get-ZoneIdFromApiKeysHtml {
            param([string] $Html, [string] $ZoneFqdn)
            $esc = [regex]::Escape($ZoneFqdn)
            $m = [regex]::Match($Html, "name=`"zone_ids`" value=`"(\d+)`"\s*/>\s*<code>$esc</code>", 'Singleline,IgnoreCase')
            if (-not $m.Success) { throw "Could not find zone id for $ZoneFqdn" }
            return [int]$m.Groups[1].Value
          }

          function Get-ApiKeyFromCreateHtml {
            param([string] $Html)
            $m = [regex]::Match($Html, 'data-created-api-key="([^"]+)"')
            if (-not $m.Success) {
              $m = [regex]::Match($Html, 'API key created:\s*([^<\s]+)')
            }
            if (-not $m.Success) { throw 'Could not extract API key from HTML' }
            return $m.Groups[1].Value
          }

          function Invoke-DnsRecord {
            param(
              [string] $ApiKey,
              [int] $ExpectedStatus,
              [string] $Method = 'POST',
              [hashtable] $JsonBody,
              [hashtable] $Query
            )
            $url = "$base/dns-record"
            if ($Query) {
              $pairs = $Query.GetEnumerator() | ForEach-Object {
                '{0}={1}' -f $_.Key, [uri]::EscapeDataString([string]$_.Value)
              }
              $url = "$url`?" + ($pairs -join '&')
            }
            $args = @{
              Uri               = $url
              Method            = $Method
              Headers           = @{ 'X-API-Key' = $ApiKey }
              UseBasicParsing   = $true
              SkipHttpErrorCheck = $true
            }
            if ($JsonBody) {
              $args.Body = ($JsonBody | ConvertTo-Json -Compress -Depth 6)
              $args.ContentType = 'application/json'
            }
            $label = "$Method /dns-record"
            if ($JsonBody) {
              $label = "$label $($JsonBody.zone_name) $($JsonBody.record_type) $($JsonBody.record_name)"
            }
            elseif ($Query) {
              $label = "$label $($Query.zone_name) $($Query.record_type) $($Query.record_name)"
            }
            Write-Host "[microsoft] $label expecting HTTP $ExpectedStatus"
            $resp = Invoke-WebRequest @args
            Write-Host "[microsoft] $label returned HTTP $($resp.StatusCode)"
            if ([int]$resp.StatusCode -ne $ExpectedStatus) {
              throw "dns-record expected HTTP $ExpectedStatus got $($resp.StatusCode): $($resp.Content)"
            }
            return $resp.Content | ConvertFrom-Json
          }

          function Assert-DnsRecordAction {
            param($Json, [string] $ExpectedAction)
            if ($ExpectedAction -eq 'access_denied') {
              if ($Json.detail.error -ne 'access_denied') { throw "expected access_denied: $($Json | ConvertTo-Json -Compress)" }
            }
            elseif ($Json.action -ne $ExpectedAction) {
              throw "expected action $ExpectedAction got $($Json | ConvertTo-Json -Compress)"
            }
          }

          function Wait-LocalA {
            param([string] $Fqdn, [string] $ExpectedIp, [string] $DnsServer = '127.0.0.1')
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $DnsServer -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -ne $r -and $r.IPAddress -eq $ExpectedIp) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn -> $ExpectedIp on $DnsServer"
          }

          function Wait-LocalAbsent {
            param([string] $Fqdn, [string] $DnsServer = '127.0.0.1')
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $DnsServer -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -eq $r -or [string]::IsNullOrEmpty($r.IPAddress)) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn absent on $DnsServer"
          }

          function Wait-RemoteA {
            param([string] $Fqdn, [string] $ExpectedIp, [string] $Server)
            if ([string]::IsNullOrWhiteSpace($Server)) { return }
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $Server -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -ne $r -and $r.IPAddress -eq $ExpectedIp) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn -> $ExpectedIp via $Server"
          }

          function Wait-RemoteAbsent {
            param([string] $Fqdn, [string] $Server)
            if ([string]::IsNullOrWhiteSpace($Server)) { return }
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $Server -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -eq $r -or [string]::IsNullOrEmpty($r.IPAddress)) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn absent at $Server"
          }

          try {
            $python = (Get-Command python -ErrorAction Stop).Source
            $envFile = Join-Path $workspace '.env'
            $apiArgs = @(
              '-m', 'uvicorn', 'src.app:app',
              '--host', '127.0.0.1',
              '--port', '8000',
              '--env-file', $envFile
            )
            $apiProcess = Start-Process -FilePath $python -ArgumentList $apiArgs -WorkingDirectory $workspace `
              -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr -PassThru
            Write-Host "Started native API process $($apiProcess.Id)."

            Wait-LoginPage

            Write-Host '[microsoft] GET /login and start admin session'
            $null = Invoke-WebRequest -Uri "$base/login" -UseBasicParsing -SessionVariable 'WebSession'
            Write-Host '[microsoft] POST /login as admin'
            $login = Invoke-FormPost -Uri "$base/login" -WebSession $WebSession -Form @{
              username = 'admin'
              password = 'your-admin-password'
            }
            if ($login.StatusCode -notin @(200, 303)) {
              throw "Login POST unexpected status $($login.StatusCode)"
            }

            Write-Host '[microsoft] GET /admin'
            $admin = Invoke-WebRequest -Uri "$base/admin" -WebSession $WebSession -UseBasicParsing
            if ($admin.Content -notmatch 'api-to-dns App Dashboard') {
              throw 'Admin page did not contain expected title (session or credentials).'
            }

            # PowerShell does not treat \ as an escape, so ".\\$user" produced a literal
            # ".\\gh-dns-smoke" (two backslashes). NTLM (requests-ntlm) needs domain\user
            # with a single backslash; for a local account use computername\user.
            $localUser = "$($env:COMPUTERNAME)\$($env:LOCAL_WINRM_USER)"
            $localPass = $env:LOCAL_WINRM_PASSWORD
            $la = $env:LOCAL_ALLOWED_ZONE
            $ld = $env:LOCAL_DENIED_ZONE
            # Use the machine's NetBIOS name (not 127.0.0.1) so NTLM SPN matches and
            # the loopback check (KB 896861) is not triggered.
            $localDnsServer = $env:COMPUTERNAME

            # #region agent diagnostics (keep until WinRM smoke is confirmed green)
            Write-Host "Local WinRM user (sanitized): $($env:COMPUTERNAME)\<user>"
            Write-Host "Local WinRM user backslash count: $((($localUser -split '\\').Count - 1))"
            Write-Host "Local DNS/WinRM target = $localDnsServer"
            $tokenPolicy = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue).LocalAccountTokenFilterPolicy
            $loopback   = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name DisableLoopbackCheck -ErrorAction SilentlyContinue).DisableLoopbackCheck
            Write-Host "LocalAccountTokenFilterPolicy = $tokenPolicy ; DisableLoopbackCheck = $loopback"
            Write-Host "TrustedHosts = $((Get-Item WSMan:\localhost\Client\TrustedHosts).Value)"
            try { Test-WSMan -ComputerName $localDnsServer -ErrorAction Stop | Out-Null; Write-Host "Test-WSMan $localDnsServer : OK" } catch { Write-Host "Test-WSMan $localDnsServer failed: $($_.Exception.Message)" }
            # #endregion agent diagnostics

            foreach ($z in @($la, $ld)) {
              Write-Host "[microsoft-local] Configure zone $z"
              $zoneResp = Invoke-FormPost -Uri "$base/zones" -WebSession $WebSession -Form @{
                zone_name           = $z
                dns_zone            = $z
                dns_provider_type   = 'microsoft'
                dns_server          = $localDnsServer
                dns_username        = $localUser
                dns_password        = $localPass
              }
              if ($zoneResp.StatusCode -ne 200 -or (
                $zoneResp.Content -notmatch "Zone '$([regex]::Escape($z))' added" -and
                $zoneResp.Content -notmatch "Zone &#39;$([regex]::Escape($z))&#39; added"
              )) {
                Write-Host "[microsoft-local] Zone create response excerpt:"
                Write-Host $zoneResp.Content.Substring(0, [Math]::Min(1200, $zoneResp.Content.Length))
                throw "Zone create failed for ${z}: HTTP $($zoneResp.StatusCode)"
              }
            }

            Write-Host '[microsoft-local] GET /api-keys'
            $keysHtml = (Invoke-WebRequest -Uri "$base/api-keys" -WebSession $WebSession -UseBasicParsing).Content
            $zoneId = Get-ZoneIdFromApiKeysHtml -Html $keysHtml -ZoneFqdn $la

            Write-Host '[microsoft-local] POST /api-keys'
            $createKey = Invoke-FormPost -Uri "$base/api-keys" -WebSession $WebSession -MaximumRedirection 10 -Form @{
              label    = 'ms-local-smoke'
              zone_ids = "$zoneId"
            }
            $msLocalKey = Get-ApiKeyFromCreateHtml -Html $createKey.Content

            Write-Host '[microsoft-local] GET /keycheck'
            $kc = Invoke-RestMethod -Uri "$base/keycheck" -Headers @{ 'X-API-Key' = $msLocalKey }
            if ($kc.status -ne 'success') { throw 'keycheck failed' }

            $www = "www.$la"
            $jCreate  = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.10') }
            $jReplace = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.20') }
            $jPatchTtl = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; ttl = 450 }
            $jPatch   = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; values = @('192.0.2.30') }
            $qDelete  = @{ zone_name = $la; record_name = 'www'; record_type = 'A' }
            $jDenied  = @{ zone_name = $ld; record_type = 'A'; record_name = 'blocked'; ttl = 300; values = @('192.0.2.55') }

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method POST -JsonBody $jCreate
            Assert-DnsRecordAction -Json $x -ExpectedAction 'created'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.10'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method PATCH -JsonBody $jPatchTtl
            Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.10'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 409 -Method POST -JsonBody $jCreate
            Assert-DnsRecordAction -Json $x -ExpectedAction 'record_already_exists'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method PUT -JsonBody $jReplace
            Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.20'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method PATCH -JsonBody $jPatch
            Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.30'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method DELETE -Query $qDelete
            Assert-DnsRecordAction -Json $x -ExpectedAction 'deleted'
            Wait-LocalAbsent -Fqdn $www

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 404 -Method DELETE -Query $qDelete
            Assert-DnsRecordAction -Json $x -ExpectedAction 'not_found'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 404 -Method PUT -JsonBody $jReplace
            Assert-DnsRecordAction -Json $x -ExpectedAction 'not_found'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 403 -Method POST -JsonBody $jDenied
            Assert-DnsRecordAction -Json $x -ExpectedAction 'access_denied'

            if ($env:REMOTE_WINRM_HOST -and $env:REMOTE_WINRM_USER -and $env:REMOTE_WINRM_PASSWORD) {
              Write-Host '=== Remote Microsoft DNS (secrets) ==='
              $remoteDig = $env:INPUT_QUERY_SERVER
              if ([string]::IsNullOrWhiteSpace($remoteDig)) { $remoteDig = $env:REMOTE_QUERY_HOST }

              $ra = $env:REMOTE_ALLOWED_ZONE
              $rd = $env:REMOTE_DENIED_ZONE
              foreach ($z in @($ra, $rd)) {
                Write-Host "[microsoft-remote] Configure zone $z"
                $form = @{
                  zone_name           = $z
                  dns_zone            = $z
                  dns_provider_type   = 'microsoft'
                  dns_server          = $env:REMOTE_WINRM_HOST
                  dns_username        = $env:REMOTE_WINRM_USER
                  dns_password        = $env:REMOTE_WINRM_PASSWORD
                }
                if ($env:REMOTE_WINRM_SSL -in @('true', 'True', '1')) {
                  $form['dns_winrm_ssl'] = 'true'
                  # Ephemeral self-signed lab hosts only; production must leave this unchecked.
                  $form['dns_winrm_insecure_tls'] = 'true'
                }
                $zoneResp = Invoke-FormPost -Uri "$base/zones" -WebSession $WebSession -Form $form
                if ($zoneResp.StatusCode -ne 200 -or (
                  $zoneResp.Content -notmatch "Zone '$([regex]::Escape($z))' added" -and
                  $zoneResp.Content -notmatch "Zone &#39;$([regex]::Escape($z))&#39; added"
                )) {
                  Write-Host "[microsoft-remote] Zone create response excerpt:"
                  Write-Host $zoneResp.Content.Substring(0, [Math]::Min(1200, $zoneResp.Content.Length))
                  throw "Remote zone create failed for ${z}: HTTP $($zoneResp.StatusCode)"
                }
              }

              Write-Host '[microsoft-remote] GET /api-keys'
              $keysHtml2 = (Invoke-WebRequest -Uri "$base/api-keys" -WebSession $WebSession -UseBasicParsing).Content
              $rZoneId = Get-ZoneIdFromApiKeysHtml -Html $keysHtml2 -ZoneFqdn $ra
              Write-Host '[microsoft-remote] POST /api-keys'
              $rk = Invoke-FormPost -Uri "$base/api-keys" -WebSession $WebSession -MaximumRedirection 10 -Form @{ label = 'ms-remote-smoke'; zone_ids = "$rZoneId" }
              $msRemoteKey = Get-ApiKeyFromCreateHtml -Html $rk.Content

              $rWww = "www.$ra"
              $rjC = @{ zone_name = $ra; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.10') }
              $rjU = @{ zone_name = $ra; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.20') }
              $rqD = @{ zone_name = $ra; record_name = 'www'; record_type = 'A' }
              $rjX = @{ zone_name = $rd; record_type = 'A'; record_name = 'blocked'; ttl = 300; values = @('192.0.2.55') }

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 200 -Method POST -JsonBody $rjC
              Assert-DnsRecordAction -Json $x -ExpectedAction 'created'
              Wait-RemoteA -Fqdn $rWww -ExpectedIp '192.0.2.10' -Server $remoteDig

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 200 -Method PUT -JsonBody $rjU
              Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
              Wait-RemoteA -Fqdn $rWww -ExpectedIp '192.0.2.20' -Server $remoteDig

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 200 -Method DELETE -Query $rqD
              Assert-DnsRecordAction -Json $x -ExpectedAction 'deleted'
              Wait-RemoteAbsent -Fqdn $rWww -Server $remoteDig

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 404 -Method DELETE -Query $rqD
              Assert-DnsRecordAction -Json $x -ExpectedAction 'not_found'

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 403 -Method POST -JsonBody $rjX
              Assert-DnsRecordAction -Json $x -ExpectedAction 'access_denied'
            }
            else {
              Write-Host '=== Remote Microsoft DNS skipped (set MICROSOFT_DNS_WINRM_* secrets) ==='
            }

            Write-Host 'Microsoft smoke (native API + PowerShell HTTP) completed successfully.'
          }
          finally {
            if ($apiProcess -and -not $apiProcess.HasExited) {
              Stop-Process -Id $apiProcess.Id -Force -ErrorAction SilentlyContinue
            }
            foreach ($log in @($apiOut, $apiErr)) {
              if (Test-Path $log) {
                Write-Host "=== $log ==="
                Get-Content $log | Write-Host
              }
            }
          }
