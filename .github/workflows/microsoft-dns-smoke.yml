# Tests: pytest on **develop**; BIND and Microsoft DNS smoke tests on **release**.
# - **pytest**: unit tests on ubuntu (`python -m pytest`).
# - **bind-smoke-linux**: checkout on ubuntu, `docker build`, Trivy High/Critical scan, BIND + API in Docker (bash).
# - **microsoft-dns-smoke-windows**: install DNS Server on windows-2025, run the API natively with Python/uvicorn,
#   then inline PowerShell (Invoke-WebRequest / Invoke-RestMethod) exercises local + optional remote Microsoft DNS.
#
# Why not `docker build` on the Windows runner: the official Python image **does** publish `linux/amd64`, but a Windows
# daemon without a working Linux backend often fails with **"no matching manifest for linux/amd64"** on pull. WSL2 may
# be present on the image without a usable default distro / Linux Docker context. Running the API natively on Windows
# avoids Linux Docker/WSL for the Microsoft DNS smoke; BIND parity remains covered on Ubuntu.
#
# Optional remote lab secrets: MICROSOFT_DNS_WINRM_HOST, USER, PASSWORD, SSL, QUERY_HOST

name: Pytest + Bind + Microsoft DNS smoke

on:
  push:
    branches:
      - develop
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (ubuntu)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  bind-smoke-linux:
    name: BIND and Docker image smoke (ubuntu + Docker)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@v6

      - name: Copy env example for testing
        run: cp .env.example .env

      - name: Generate encryption and session secrets for testing
        run: |
          KEY="$(python - <<'PY'
          import base64
          import os
          import secrets

          print(base64.urlsafe_b64encode(os.urandom(32)).decode())
          print(secrets.token_urlsafe(32))
          PY
          )"
          ENC_KEY="$(printf '%s\n' "$KEY" | sed -n '1p')"
          SECRET="$(printf '%s\n' "$KEY" | sed -n '2p')"
          sed -i.bak "s|ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${ENC_KEY}|" .env
          sed -i.bak "s|SECRET_KEY=.*|SECRET_KEY=${SECRET}|" .env
          rm -f .env.bak
          echo 'Generated encryption and session secrets for testing'

      - name: Build the Docker image
        run: |
          IMAGE_TAG="api-to-dns-bind-smoke:$(date +%s)"
          docker build . --file Dockerfile --tag "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          OCI_VERSION="$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          if [ "$OCI_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Expected org.opencontainers.image.version=${EXPECTED_VERSION}; got ${OCI_VERSION}"
            exit 1
          fi
          echo "OCI version label ${OCI_VERSION} matches VERSION"

      - name: Scan smoke image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Install and start rsyslog receiver
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes rsyslog
          # apt postinst may restart the distro unit; stop it before the smoke instance.
          sudo systemctl stop rsyslog.service 2>/dev/null || true
          sudo systemctl disable rsyslog.service 2>/dev/null || true
          # Ubuntu AppArmor only allows the stock /etc/rsyslog.conf path; unload for this job.
          if [ -f /etc/apparmor.d/usr.sbin.rsyslogd ]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.rsyslogd /etc/apparmor.d/disable/usr.sbin.rsyslogd
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.rsyslogd || true
          fi

          SYSLOG_OUTPUT="/var/log/api-to-dns-syslog-smoke.out"
          SYSLOG_CONF="/etc/rsyslog-smoke.conf"
          SYSLOG_PID_FILE="/tmp/rsyslog-smoke.pid"
          sudo tee "${SYSLOG_CONF}" >/dev/null <<EOF
          module(load="imudp")
          input(type="imudp" port="5514" address="0.0.0.0")
          template(name="SmokeFmt" type="string" string="%rawmsg%\n")
          *.* action(type="omfile" file="${SYSLOG_OUTPUT}" template="SmokeFmt")
          EOF
          sudo touch "${SYSLOG_OUTPUT}"
          sudo chown syslog:adm "${SYSLOG_OUTPUT}"
          sudo chmod 644 "${SYSLOG_OUTPUT}"
          sudo truncate -s 0 "${SYSLOG_OUTPUT}"

          sudo rsyslogd -n -f "${SYSLOG_CONF}" -i "${SYSLOG_PID_FILE}" &
          echo $! > /tmp/rsyslog-smoke.shell.pid
          # Readiness: process alive and UDP 5514 listening.
          for i in $(seq 1 30); do
            if kill -0 "$(cat /tmp/rsyslog-smoke.shell.pid)" 2>/dev/null \
              && ss -lun | grep -q ':5514'; then
              break
            fi
            sleep 0.5
          done
          if ! kill -0 "$(cat /tmp/rsyslog-smoke.shell.pid)" 2>/dev/null; then
            echo "rsyslog receiver process is not running"
            sudo dmesg | tail -n 40 || true
            sudo cat /var/log/syslog 2>/dev/null | tail -n 50 || true
            exit 1
          fi
          if ! ss -lun | grep -q ':5514'; then
            echo "rsyslog did not open UDP 5514"
            exit 1
          fi
          echo "rsyslog receiver ready on UDP 5514"
          {
            echo "SYSLOG_OUTPUT=${SYSLOG_OUTPUT}"
            echo "SYSLOG_PID_FILE=${SYSLOG_PID_FILE}"
            echo "RSYSLOG_SHELL_PID=$(cat /tmp/rsyslog-smoke.shell.pid)"
          } >> "$GITHUB_ENV"

      - name: Run BIND-backed smoke test
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          NETWORK_NAME="dns-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BIND_DIR="${RUNNER_TEMP}/bind-smoke"
          TSIG_NAME="api-to-dns."
          TSIG_SECRET="$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          : "${SYSLOG_OUTPUT:?SYSLOG_OUTPUT must be set by the rsyslog prerequisite step}"
          : "${RSYSLOG_SHELL_PID:?RSYSLOG_SHELL_PID must be set by the rsyslog prerequisite step}"

          cleanup() {
            echo "Collecting container logs..."
            docker logs dns-api-test 2>/dev/null || true
            docker logs bind-test 2>/dev/null || true
            docker rm -f dns-api-test bind-test 2>/dev/null || true
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            docker network rm "${NETWORK_NAME}" 2>/dev/null || true
            echo "Stopping rsyslog receiver..."
            if [ -n "${SYSLOG_PID_FILE:-}" ] && [ -f "${SYSLOG_PID_FILE}" ]; then
              sudo kill "$(cat "${SYSLOG_PID_FILE}")" 2>/dev/null || true
            fi
            sudo kill "${RSYSLOG_SHELL_PID}" 2>/dev/null || true
            if [ -f "${SYSLOG_OUTPUT:-}" ]; then
              echo "---- syslog receiver output (tail) ----"
              sudo tail -n 100 "${SYSLOG_OUTPUT}" || true
            fi
          }
          trap cleanup EXIT

          mkdir -p "${BIND_DIR}"
          python3 - "${BIND_DIR}" "${TSIG_NAME}" "${TSIG_SECRET}" <<'PY'
          import sys
          from pathlib import Path

          bind_dir = Path(sys.argv[1])
          tsig_name = sys.argv[2]
          tsig_secret = sys.argv[3]

          named_conf = (
              'key "' + tsig_name + '" {\n'
              "  algorithm hmac-sha256;\n"
              '  secret "' + tsig_secret + '";\n'
              "};\n"
              "\n"
              "options {\n"
              '  directory "/bind";\n'
              "  listen-on port 53 { any; };\n"
              "  listen-on-v6 { none; };\n"
              "  allow-query { any; };\n"
              "  recursion no;\n"
              "  dnssec-validation no;\n"
              "};\n"
              "\n"
              'zone "smoke.test" {\n'
              "  type master;\n"
              '  file "/bind/db.smoke.test";\n'
              '  allow-update { key "' + tsig_name + '"; };\n'
              '  allow-transfer { key "' + tsig_name + '"; };\n'
              "};\n"
              "\n"
              'zone "denied.test" {\n'
              "  type master;\n"
              '  file "/bind/db.denied.test";\n'
              '  allow-update { key "' + tsig_name + '"; };\n'
              "  allow-transfer { none; };\n"
              "};\n"
          )

          zone_smoke = """$TTL 300
          @ IN SOA ns.smoke.test. hostmaster.smoke.test. (
            1 ; serial
            300 ; refresh
            300 ; retry
            300 ; expire
            300 ; minimum
          )
          @ IN NS ns.smoke.test.
          ns IN A 127.0.0.1
          """

          zone_denied = """$TTL 300
          @ IN SOA ns.denied.test. hostmaster.denied.test. (
            1 ; serial
            300 ; refresh
            300 ; retry
            300 ; expire
            300 ; minimum
          )
          @ IN NS ns.denied.test.
          ns IN A 127.0.0.1
          """

          def _unindent(s: str) -> str:
              return "\n".join(line.lstrip() for line in s.splitlines()).strip() + "\n"

          (bind_dir / "named.conf").write_text(_unindent(named_conf), newline="\n")
          (bind_dir / "db.smoke.test").write_text(_unindent(zone_smoke), newline="\n")
          (bind_dir / "db.denied.test").write_text(_unindent(zone_denied), newline="\n")
          PY

          chmod -R a+rwX "${BIND_DIR}"
          docker network create "${NETWORK_NAME}"

          docker run -d --name bind-test --network "${NETWORK_NAME}" \
            -e BIND9_USER=root \
            -v "${BIND_DIR}:/bind:rw" \
            ubuntu/bind9:9.18-22.04_edge \
            -c /bind/named.conf

          for i in $(seq 1 60); do
            if docker exec bind-test ss -lun 2>/dev/null | grep -q ':53'; then
              break
            fi
            if [ -z "$(docker ps -q -f name=bind-test -f status=running)" ]; then
              echo "BIND container exited before becoming ready"
              docker logs bind-test 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          if ! docker exec bind-test ss -lun 2>/dev/null | grep -q ':53'; then
            echo "BIND did not open port 53 in time"
            docker logs bind-test 2>&1 | tail -n 200 || true
            exit 1
          fi

          docker exec bind-test bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -qq -y dnsutils'

          for i in $(seq 1 30); do
            if docker exec bind-test dig @127.0.0.1 smoke.test SOA +short >/tmp/bind-soa.txt 2>/dev/null && [ -s /tmp/bind-soa.txt ]; then
              break
            fi
            if [ -z "$(docker ps -q -f name=bind-test -f status=running)" ]; then
              echo "BIND container exited during dnsutils install or query wait"
              docker logs bind-test 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          if [ ! -s /tmp/bind-soa.txt ]; then
            echo "dig did not return SOA for smoke.test"
            docker logs bind-test 2>&1 | tail -n 200 || true
            exit 1
          fi

          # Image USER default must be non-root even without an explicit --user override.
          DEFAULT_IMAGE_USER="$(docker run --rm --entrypoint id "$IMAGE_TAG" -u)"
          if [ "${DEFAULT_IMAGE_USER}" = "0" ]; then
            echo "Image default USER is root; Dockerfile must set USER app (10001)"
            exit 1
          fi

          docker run -d --name dns-api-test --network "${NETWORK_NAME}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --add-host=host.docker.internal:host-gateway \
            --tmpfs /tmp:size=64M,mode=1777 \
            --tmpfs /app/data:size=64M,uid=10001,gid=10001,mode=1755 \
            --tmpfs /app/logs:size=16M,uid=10001,gid=10001,mode=1755 \
            --env-file .env \
            -e RATE_LIMIT_LOGIN=3:8 \
            -e OPENAPI_ENABLED=1 \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE_TAG"

          UID_IN_CONTAINER="$(docker exec dns-api-test id -u)"
          if [ "$UID_IN_CONTAINER" = "0" ]; then
            echo "API container process is running as root"
            exit 1
          fi

          for i in $(seq 1 60); do
            # Probe /health (not /login) so readiness checks do not consume RATE_LIMIT_LOGIN.
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ -z "$(docker ps -q -f name=dns-api-test -f status=running)" ]; then
              echo "API container exited before becoming ready"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8000/ready \
            | python3 -c "import json,sys; assert json.load(sys.stdin)=={'status':'ready'}"

          # Read /proc/1/cmdline inside the container (host-side < redirects to the runner).
          API_CMDLINE="$(docker exec dns-api-test sh -c 'tr "\0" " " < /proc/1/cmdline')"
          echo "dns-api-test cmdline: ${API_CMDLINE}"
          case " ${API_CMDLINE} " in
            *" --workers 1 "*|*" --workers=1 "*) ;;
            *)
              echo "Expected uvicorn --workers 1; got: ${API_CMDLINE}"
              exit 1
              ;;
          esac

          echo "[bind] Security defaults: authenticated OpenAPI/docs, headers, CSRF, logout method"
          schema_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/openapi.json")"
          if [ "${schema_code}" != "401" ]; then
            echo "Expected /openapi.json to return 401 without a session; got ${schema_code}"
            exit 1
          fi
          for path in /docs /redoc /docs/oauth2-redirect; do
            code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${path}")"
            if [ "${code}" != "303" ]; then
              echo "Expected ${path} to redirect to login without a session; got ${code}"
              exit 1
            fi
          done
          curl --fail --silent -D /tmp/health-headers -o /dev/null http://127.0.0.1:8000/health
          python3 - <<'PY'
          from pathlib import Path
          headers = Path("/tmp/health-headers").read_text(encoding="utf-8", errors="replace").lower()
          for name in (
              "x-content-type-options: nosniff",
              "x-frame-options: deny",
              "referrer-policy: same-origin",
              "content-security-policy: default-src 'self';",
              "script-src 'self';",
              "style-src 'self';",
          ):
              assert name in headers, f"missing security header: {name}\n{headers}"
          assert "unsafe-inline" not in headers, headers
          PY
          logout_get_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/logout)"
          if [ "${logout_get_code}" != "405" ]; then
            echo "Expected GET /logout to return 405; got ${logout_get_code}"
            exit 1
          fi

          echo "[bind] Login rate limit (RATE_LIMIT_LOGIN=3:8) before other /login probes"
          for i in $(seq 1 4); do
            rl_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/login \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Origin: http://127.0.0.1:8000" \
              -H "Referer: http://127.0.0.1:8000/login" \
              -d "username=nobody&password=wrong-password")"
            if [ "${i}" -le 3 ] && [ "${rl_code}" = "429" ]; then
              echo "Login rate-limited too early on attempt ${i}"
              exit 1
            fi
            if [ "${i}" -eq 4 ] && [ "${rl_code}" != "429" ]; then
              echo "Expected 429 on 4th login attempt; got ${rl_code}"
              exit 1
            fi
          done
          # Wait for the short login window to expire before CSRF + real login.
          sleep 9

          csrf_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: https://evil.example" \
            -d "username=admin&password=your-admin-password")"
          if [ "${csrf_code}" != "403" ]; then
            echo "Expected cross-origin login POST to return 403; got ${csrf_code}"
            exit 1
          fi

          echo "[bind] Login as admin"
          curl --fail --silent -c /tmp/cookies -D /tmp/login-headers -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          python3 - <<'PY'
          from pathlib import Path
          headers = Path("/tmp/login-headers").read_text(encoding="utf-8", errors="replace")
          assert "set-cookie:" in headers.lower(), headers
          # HTTP smoke has no TLS; Secure cookie must not be forced unless SESSION_COOKIE_SECURE=1.
          cookie_lines = [line for line in headers.splitlines() if line.lower().startswith("set-cookie:")]
          assert cookie_lines, headers
          assert all("secure" not in line.lower() for line in cookie_lines), cookie_lines
          PY
          curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("/tmp/openapi.json").read_text(encoding="utf-8"))
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert schema["info"]["version"] == version, schema.get("info")
          desc = schema["components"]["schemas"]["DnsRecordInfo"]["properties"]["record_type"]["description"]
          for token in ("MX", "NS", "SRV", "CAA", "PTR", "SOA"):
              assert token in desc, (token, desc)
          print("OpenAPI version + DnsRecordInfo lookup-type description assertions passed")
          PY
          docs_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -b /tmp/cookies http://127.0.0.1:8000/docs)"
          if [ "${docs_code}" != "200" ]; then
            echo "Expected authenticated /docs to return 200; got ${docs_code}"
            exit 1
          fi
          oauth_code="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -b /tmp/cookies http://127.0.0.1:8000/docs/oauth2-redirect)"
          if [ "${oauth_code}" != "200" ]; then
            echo "Expected authenticated /docs/oauth2-redirect to return 200; got ${oauth_code}"
            exit 1
          fi
          echo "[bind] BINDCONFIG.md uses placeholder TSIG secret only"
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("BINDCONFIG.md").read_text(encoding="utf-8")
          secrets = re.findall(r'secret\s+"([^"]+)"', text)
          assert secrets, "expected at least one secret example in BINDCONFIG.md"
          assert all(value == "<BASE64_TSIG_SECRET_FROM_tsig-keygen>" for value in secrets), secrets
          allowlist = Path(".gitleaks.toml").read_text(encoding="utf-8")
          assert "<BASE64_TSIG_SECRET_FROM_tsig-keygen>" in allowlist
          print("BINDCONFIG placeholder + gitleaks allowlist assertions passed")
          PY
          echo "[bind] Verify admin page, shared nav, and version metadata"
          curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/admin -o /tmp/admin.html
          python3 - <<'PY'
          from pathlib import Path

          html = Path("/tmp/admin.html").read_text(encoding="utf-8", errors="replace")
          assert "api-to-dns Dashboard" in html, html[:800]
          assert "Configured zones" in html, html[:800]
          nav = html.split('<nav class="nav-links">', 1)[1].split("</nav>", 1)[0]
          assert nav.index('href="/api-keys"') < nav.index('href="/admin"') < nav.index('href="/settings"') < nav.index('action="/logout"'), nav
          version = Path("VERSION").read_text(encoding="utf-8").strip()
          assert version == "0.8.5", version
          assert f"api-to-dns v{version}" in html, html[-400:]
          assert 'version = "0.8.5"' in Path("pyproject.toml").read_text(encoding="utf-8")
          assert "ARG VERSION=0.8.5" in Path("Dockerfile").read_text(encoding="utf-8")
          assert "hometinker12/api-to-dns:0.8.5" in Path("docker-compose.yml").read_text(encoding="utf-8")
          print("admin nav + 0.8.5 metadata assertions passed")
          PY

          echo "[bind] Static brand assets (favicon + logo mark)"
          curl --fail --silent -D /tmp/favicon.headers -o /tmp/favicon.svg \
            "http://127.0.0.1:8000/static/favicon.svg?v=2"
          curl --fail --silent -D /tmp/logo-mark.headers -o /tmp/logo-mark.svg \
            "http://127.0.0.1:8000/static/logo-mark.svg?v=2"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name, headers_path, body_path in (
              ("favicon", Path("/tmp/favicon.headers"), Path("/tmp/favicon.svg")),
              ("logo-mark", Path("/tmp/logo-mark.headers"), Path("/tmp/logo-mark.svg")),
          ):
              headers = headers_path.read_text(encoding="utf-8", errors="replace").lower()
              assert "content-type: image/svg+xml" in headers, (name, headers)
              body = body_path.read_text(encoding="utf-8")
              assert "<svg" in body.lower(), (name, body[:200])
              ET.fromstring(body)
          print("static brand asset assertions passed")
          PY
          echo "[bind] Static JavaScript assets for CSP-hardened admin pages"
          for asset in theme page-header configured-zones api-keys zone-form settings dns-browser; do
            curl --fail --silent -D "/tmp/${asset}.headers" -o "/dev/null" \
              "http://127.0.0.1:8000/static/${asset}.js"
            if ! grep -qi '^content-type:.*javascript' "/tmp/${asset}.headers"; then
              echo "Expected JavaScript content type for ${asset}.js"
              cat "/tmp/${asset}.headers"
              exit 1
            fi
          done

          echo "[bind] POST logout clears session"
          curl --fail --silent -b /tmp/cookies -c /tmp/cookies -X POST http://127.0.0.1:8000/logout \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/admin" \
            -o /dev/null
          admin_after_logout="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -b /tmp/cookies http://127.0.0.1:8000/admin)"
          if [ "${admin_after_logout}" != "303" ] && [ "${admin_after_logout}" != "401" ] && [ "${admin_after_logout}" != "302" ]; then
            # Unauthenticated browser /admin redirects to /login (303) via exception handler.
            echo "Expected unauthenticated /admin after logout; got ${admin_after_logout}"
            exit 1
          fi
          curl --fail --silent -c /tmp/cookies -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null

          echo "[bind] Remote syslog end-to-end (rsyslog already installed and ready)"
          sudo truncate -s 0 "${SYSLOG_OUTPUT}"
          curl --fail --silent -b /tmp/cookies -X POST \
            http://127.0.0.1:8000/settings/system/syslog \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/settings?area=system_settings&section=syslog_forwarding" \
            --data-urlencode "syslog_enabled=on" \
            --data-urlencode "syslog_host=host.docker.internal" \
            --data-urlencode "syslog_port=5514" \
            --data-urlencode "syslog_protocol=udp" \
            --data-urlencode "syslog_facility=local0" \
