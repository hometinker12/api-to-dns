          curl --fail --silent -b /tmp/cookies "http://127.0.0.1:8000/api-keys/${READ_ONLY_KEY_ID}/edit" -o /tmp/api-key-edit-page.html
          python3 - <<'PY'
          from pathlib import Path

          html = Path("/tmp/api-key-edit-page.html").read_text(encoding="utf-8")
          assert 'name="access_mode" value="read_only" checked' in html, html
          assert 'name="access_mode" value="read_write"' in html, html
          PY
          curl --fail --silent -b /tmp/cookies -X POST "http://127.0.0.1:8000/api-keys/${READ_ONLY_KEY_ID}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/api-keys/${READ_ONLY_KEY_ID}/edit" \
            --data-urlencode "label=bind-smoke-read-only" \
            --data-urlencode "access_mode=read_write" \
            --data-urlencode "zone_ids=${SMOKE_ZONE_ID}" \
            -o /tmp/api-key-dedicated-edit-write.html
          curl --fail --silent -X POST "${DNS_RECORD_URL}" \
            -H "X-API-Key: ${READ_ONLY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"zone_name":"smoke.test","record_type":"A","record_name":"dedicated-edit","ttl":300,"values":["192.0.2.52"]}' \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['action'] == 'created'"
          curl --fail --silent -b /tmp/cookies -X POST "http://127.0.0.1:8000/api-keys/${READ_ONLY_KEY_ID}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/api-keys/${READ_ONLY_KEY_ID}/edit" \
            --data-urlencode "label=bind-smoke-read-only" \
            --data-urlencode "access_mode=read_only" \
            --data-urlencode "zone_ids=${SMOKE_ZONE_ID}" \
            -o /tmp/api-key-dedicated-edit-read-only.html
          call_read_only_dns_api DELETE "${DNS_RECORD_URL}?zone_name=smoke.test&record_name=dedicated-edit&record_type=A" ''
          call_dns_api DELETE 200 deleted "http://127.0.0.1:8000/dns-record?zone_name=smoke.test&record_name=dedicated-edit&record_type=A" ''

          call_dns_api POST 200 created "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.10"]}'
          wait_for_record_value www.smoke.test 192.0.2.10
          call_dns_api PATCH 200 updated "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":450}'
          wait_for_record_value www.smoke.test 192.0.2.10
          call_dns_api POST 409 record_already_exists "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.10"]}'
          call_dns_api PUT 200 updated "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.20"]}'
          wait_for_record_value www.smoke.test 192.0.2.20
          call_dns_api PATCH 200 updated "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","values":["192.0.2.30"]}'
          wait_for_record_value www.smoke.test 192.0.2.30
          call_dns_api DELETE 200 deleted "${DELETE_SMOKE_URL}" ''
          wait_for_record_absent www.smoke.test
          call_dns_api DELETE 404 not_found "${DELETE_SMOKE_URL}" ''
          call_dns_api PUT 404 not_found "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.40"]}'
          call_dns_api POST 403 access_denied "${DNS_RECORD_URL}" '{"zone_name":"denied.test","record_type":"A","record_name":"blocked","ttl":300,"values":["192.0.2.55"]}'

          echo "[bind] Apex FQDN record_name maps to the zone apex A"
          call_dns_api POST 200 created "${DNS_RECORD_URL}" '{"zone_name":"smoke.test","record_type":"A","record_name":"smoke.test","ttl":300,"values":["192.0.2.80"]}'
          wait_for_record_value smoke.test 192.0.2.80
          curl --fail --silent -H "X-API-Key: ${API_KEY}" \
            "${DNS_RECORD_URL}?zone_name=smoke.test&record_name=smoke.test&record_type=A" \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='success'; assert b['records'][0]['record_name'] in ('@','smoke.test'); assert b['records'][0]['values']==['192.0.2.80'], b"
          call_dns_api DELETE 200 deleted "${DNS_RECORD_URL}?zone_name=smoke.test&record_name=smoke.test&record_type=A" ''
          wait_for_record_absent smoke.test

          echo "[bind] Admin DNS browser session CRUD for temporary A record"
          browser_page="$(curl --fail --silent -b /tmp/cookies "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records")"
          echo "${browser_page}" | python3 -c "import sys; html=sys.stdin.read(); assert 'dns-browser-search' in html; assert 'dns-browser-results' in html and 'hidden' in html"
          curl --fail --silent -b /tmp/cookies \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -X POST "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -d '{"record_name":"browser","record_type":"A","ttl":300,"values":["192.0.2.77"]}' \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['action']=='created', b"
          wait_for_record_value browser.smoke.test 192.0.2.77
          echo "[bind] DNS browser shared mutation guards reject apex NS"
          curl --silent --show-error -b /tmp/cookies \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -o /tmp/apex-ns.json -w "%{http_code}" \
            -X POST "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -d '{"record_name":"@","record_type":"NS","ttl":300,"values":["ns.smoke.test"]}' \
            | python3 -c "import json,sys; from pathlib import Path; code=sys.stdin.read().strip(); b=json.loads(Path('/tmp/apex-ns.json').read_text(encoding='utf-8')); assert code=='400', (code,b); msg=(b.get('detail') or {}).get('message') or ''; assert 'Apex NS' in msg, b"
          echo "[bind] DNS browser blank browse returns zone RRsets (AXFR)"
          curl --fail --silent -b /tmp/cookies \
            "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records/search" \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['match_mode']=='browse'; assert any(r['record_name']=='browser' and r['record_type']=='A' for r in b['records']), b"
          echo "[bind] DNS browser wildcard search matches browser record"
          curl --fail --silent -b /tmp/cookies \
            "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records/search?record_name=brow?er*&record_type=A" \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['match_mode']=='glob'; assert b['records'][0]['values']==['192.0.2.77'], b"
          curl --fail --silent -b /tmp/cookies \
            "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records/search?record_name=browser&record_type=A" \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='success'; assert b['records'][0]['values']==['192.0.2.77'], b"
          echo "[bind] DNS browser browse truncates at 100 RRsets (streamed AXFR response bound)"
          python3 - "${BIND_DIR}" <<'PY'
          from pathlib import Path
          import sys

          bind_dir = Path(sys.argv[1])
          lines = ["server 127.0.0.1", "zone smoke.test.", ""]
          for i in range(1, 121):
              lines.append(f"update add bulk{i:03d}.smoke.test. 300 A 192.0.2.{(i % 200) + 1}")
          lines.extend(["send", ""])
          (bind_dir / "bulk-add.nsupdate").write_text("\n".join(lines) + "\n", newline="\n")
          PY
          docker exec bind-test nsupdate -y "hmac-sha256:${TSIG_NAME}:${TSIG_SECRET}" /bind/bulk-add.nsupdate
          curl --fail --silent -b /tmp/cookies \
            "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records/search" \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['match_mode']=='browse', b; assert len(b['records'])==100, len(b['records']); assert b.get('truncated') is True, b"
          echo "[bind] DNS browser AXFR refused on denied.test (blank browse + glob → 400; exact lookup still works)"
          for denied_url in \
            "http://127.0.0.1:8000/zones/${DENIED_ZONE_ID}/records/search" \
            "http://127.0.0.1:8000/zones/${DENIED_ZONE_ID}/records/search?record_name=ns*&record_type=A"
          do
            denied_code="$(curl --silent --show-error -b /tmp/cookies -o /tmp/denied-browse.json -w "%{http_code}" "${denied_url}")"
            if [ "${denied_code}" != "400" ]; then
              echo "Expected HTTP 400 for AXFR-refused browser search; got ${denied_code} for ${denied_url}"
              python3 -c 'from pathlib import Path; print(Path("/tmp/denied-browse.json").read_text(encoding="utf-8", errors="replace")[:800])'
              exit 1
            fi
            python3 -c 'import json; from pathlib import Path; b=json.loads(Path("/tmp/denied-browse.json").read_text(encoding="utf-8")); msg=b.get("message") or (b.get("detail") or {}).get("message",""); assert "allow-transfer" in msg, b'
          done
          curl --fail --silent -b /tmp/cookies \
            "http://127.0.0.1:8000/zones/${DENIED_ZONE_ID}/records/search?record_name=ns&record_type=A" \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='success'; assert b['records'][0]['record_name']=='ns'; assert b['records'][0]['values']==['127.0.0.1'], b"
          curl --fail --silent -b /tmp/cookies \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -X PUT "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -d '{"record_name":"browser","record_type":"A","ttl":300,"values":["192.0.2.78"]}' \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['action']=='updated', b"
          wait_for_record_value browser.smoke.test 192.0.2.78
          curl --fail --silent -b /tmp/cookies \
            -H "Origin: http://127.0.0.1:8000" \
            -H "Referer: http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -X DELETE "http://127.0.0.1:8000/zones/${SMOKE_ZONE_ID}/records" \
            -d '{"record_name":"browser","record_type":"A"}' \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['action']=='deleted', b"
          wait_for_record_absent browser.smoke.test

          echo "[bind] API-key backup and legacy-mode compatibility"
          docker exec -i dns-api-test python - <<'PY'
          from copy import deepcopy

          from sqlmodel import select

          from src.backup_service import (
              CATEGORY_API_KEYS,
              BackupError,
              build_payload,
              restore_payload,
              validate_restore_records,
          )
          from src.db import SessionLocal
          from src.models import API_KEY_ACCESS_READ_ONLY, API_KEY_ACCESS_READ_WRITE, ApiKey

          with SessionLocal() as db:
              payload = build_payload(db, [CATEGORY_API_KEYS])
              assert any(
                  item["label"] == "bind-smoke-read-only" and item["access_mode"] == API_KEY_ACCESS_READ_ONLY
                  for item in payload[CATEGORY_API_KEYS]
              ), payload[CATEGORY_API_KEYS]
              restore_payload(db, payload, [CATEGORY_API_KEYS])
              restored = db.exec(select(ApiKey).where(ApiKey.label == "bind-smoke-read-only")).one()
              assert restored.access_mode == API_KEY_ACCESS_READ_ONLY, restored.access_mode

              legacy_payload = deepcopy(payload)
              for item in legacy_payload[CATEGORY_API_KEYS]:
                  item.pop("access_mode", None)
              restore_payload(db, legacy_payload, [CATEGORY_API_KEYS])
              legacy_restored = db.exec(select(ApiKey).where(ApiKey.label == "bind-smoke-read-only")).one()
              assert legacy_restored.access_mode == API_KEY_ACCESS_READ_WRITE, legacy_restored.access_mode

              invalid_payload = deepcopy(payload)
              next(item for item in invalid_payload[CATEGORY_API_KEYS] if item["label"] == "bind-smoke-read-only")[
                  "access_mode"
              ] = "owner"
              try:
                  validate_restore_records([CATEGORY_API_KEYS], invalid_payload)
              except BackupError:
                  pass
              else:
                  raise AssertionError("Invalid API-key access mode was accepted")
              untouched = db.exec(select(ApiKey).where(ApiKey.label == "bind-smoke-read-only")).one()
              assert untouched.access_mode == API_KEY_ACCESS_READ_WRITE, untouched.access_mode
          print("API-key backup compatibility assertions passed")
          PY
          docker exec -i dns-api-test python - <<'PY'
          from sqlalchemy import create_engine, text

          import src.db as db_module
          from src.models import API_KEY_ACCESS_READ_WRITE

          legacy_engine = create_engine("sqlite:////tmp/legacy-api-key-mode.db")
          with legacy_engine.begin() as conn:
              conn.execute(
                  text(
                      "CREATE TABLE apikey (id INTEGER PRIMARY KEY, label VARCHAR NOT NULL, "
                      "key VARCHAR NOT NULL, active BOOLEAN NOT NULL, created_at DATETIME)"
                  )
              )
              conn.execute(
                  text("INSERT INTO apikey (id, label, key, active) VALUES (1, 'legacy', 'digest', 1)")
              )
          original_engine = db_module.engine
          try:
              db_module.engine = legacy_engine
              db_module._migrate_add_api_key_access_mode_column()
              mode = legacy_engine.connect().execute(text("SELECT access_mode FROM apikey WHERE id = 1")).scalar_one()
              assert mode == API_KEY_ACCESS_READ_WRITE, mode
          finally:
              db_module.engine = original_engine
          print("legacy API-key migration assertions passed")
          PY

          echo "[compose] Validate hardened Compose config and startup against the smoke image"
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          docker tag "${IMAGE_TAG}" "hometinker12/api-to-dns:${APP_VERSION}"
          APP_VERSION="${APP_VERSION}" python3 - <<'PY'
          import json
          import os
          import subprocess

          assert os.environ["APP_VERSION"] == "0.8.5", os.environ["APP_VERSION"]
          expected_image = f"hometinker12/api-to-dns:{os.environ['APP_VERSION']}"
          cfg = json.loads(subprocess.check_output(["docker", "compose", "config", "--format", "json"], text=True))
          svc = cfg["services"]["dns-api"]
          assert svc.get("image") == expected_image, (svc.get("image"), expected_image)
          assert str(svc.get("user") or "") in {"10001:10001", "10001"}, svc.get("user")
          assert svc.get("read_only") is True, svc
          cap_drop = {str(item).upper() for item in (svc.get("cap_drop") or [])}
          assert "ALL" in cap_drop, cap_drop
          security_opt = [str(item) for item in (svc.get("security_opt") or [])]
          assert any("no-new-privileges" in item for item in security_opt), security_opt
          ports = svc.get("ports") or []

          def _has_mapping(published: str, target: int) -> bool:
              return any(
                  isinstance(port, dict)
                  and str(port.get("published")) == published
                  and int(port.get("target") or 0) == target
                  and str(port.get("host_ip") or "") == "127.0.0.1"
                  for port in ports
              )

          assert _has_mapping("8001", 8000), ports
          assert _has_mapping("8443", 8443), ports
          targets = {
              volume.get("target")
              for volume in (svc.get("volumes") or [])
              if isinstance(volume, dict)
          }
          assert {"/app/data", "/app/data/ssl", "/app/logs"} <= targets, targets
          print("compose config hardening assertions passed")
          PY
          docker compose down -v --remove-orphans >/dev/null 2>&1 || true
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8001/health >/dev/null
          curl --fail --silent http://127.0.0.1:8001/ready \
            | python3 -c "import json,sys; assert json.load(sys.stdin)=={'status':'ready'}"
          COMPOSE_UID="$(docker compose exec -T dns-api id -u | tr -d '\r')"
          if [ "${COMPOSE_UID}" = "0" ]; then
            echo "Compose service process is running as root"
            docker compose logs dns-api || true
            docker compose down -v --remove-orphans || true
            exit 1
          fi
          COMPOSE_CMDLINE="$(docker compose exec -T dns-api sh -c 'tr "\0" " " < /proc/1/cmdline' | tr -d '\r')"
          echo "compose dns-api cmdline: ${COMPOSE_CMDLINE}"
          case " ${COMPOSE_CMDLINE} " in
            *" --workers 1 "*|*" --workers=1 "*) ;;
            *)
              echo "Expected compose uvicorn --workers 1; got: ${COMPOSE_CMDLINE}"
              docker compose logs dns-api || true
              docker compose down -v --remove-orphans || true
              exit 1
              ;;
          esac
          curl --fail --silent -c /tmp/compose-cookies -X POST http://127.0.0.1:8001/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8001" \
            -H "Referer: http://127.0.0.1:8001/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          curl --fail --silent -b /tmp/compose-cookies http://127.0.0.1:8001/admin \
            | python3 -c "import sys; assert 'api-to-dns Dashboard' in sys.stdin.read()"

          echo "[compose] Persisted app_secrets.env overrides Compose env_file on restart"
          # Distinct from .env so we prove Python env_bootstrap (not shell source) wins over env_file.
          RESTORED_KEYS="$(python3 - <<'PY'
          import base64
          import hashlib
          import os
          import secrets

          enc = base64.urlsafe_b64encode(os.urandom(32)).decode()
          secret = secrets.token_urlsafe(32)
          print(enc)
          print(secret)
          print(hashlib.sha256(enc.encode()).hexdigest())
          print(hashlib.sha256(secret.encode()).hexdigest())
          PY
          )"
          RESTORED_ENC="$(printf '%s\n' "$RESTORED_KEYS" | sed -n '1p')"
          RESTORED_SECRET="$(printf '%s\n' "$RESTORED_KEYS" | sed -n '2p')"
          EXPECTED_ENC_HASH="$(printf '%s\n' "$RESTORED_KEYS" | sed -n '3p')"
          EXPECTED_SECRET_HASH="$(printf '%s\n' "$RESTORED_KEYS" | sed -n '4p')"
          # Write via stdin so restored secret values are not argv-visible in process listings.
          {
            printf 'SECRET_KEY=%s\n' "${RESTORED_SECRET}"
            printf 'ENCRYPTION_KEY=%s\n' "${RESTORED_ENC}"
          } | docker compose exec -T dns-api sh -c 'cat > /app/data/app_secrets.env && chmod 600 /app/data/app_secrets.env'
          unset RESTORED_ENC RESTORED_SECRET RESTORED_KEYS
          docker compose restart dns-api
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8001/health >/dev/null
          # Read PID 1 environ (entrypoint-sourced overrides); docker exec env alone still shows Compose env_file.
          ACTUAL_HASHES="$(
            EXPECTED_ENC_HASH="${EXPECTED_ENC_HASH}" EXPECTED_SECRET_HASH="${EXPECTED_SECRET_HASH}" \
            docker compose exec -T \
              -e EXPECTED_ENC_HASH \
              -e EXPECTED_SECRET_HASH \
              dns-api python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          raw = Path("/proc/1/environ").read_bytes()
          env: dict[str, str] = {}
          for item in raw.split(b"\0"):
              if b"=" not in item:
                  continue
              key, _, value = item.partition(b"=")
              env[key.decode()] = value.decode(errors="replace")
          enc_hash = hashlib.sha256(env.get("ENCRYPTION_KEY", "").encode()).hexdigest()
          secret_hash = hashlib.sha256(env.get("SECRET_KEY", "").encode()).hexdigest()
          assert enc_hash == os.environ["EXPECTED_ENC_HASH"], (enc_hash, os.environ["EXPECTED_ENC_HASH"])
          assert secret_hash == os.environ["EXPECTED_SECRET_HASH"], (secret_hash, os.environ["EXPECTED_SECRET_HASH"])
          print("pid1 secret hashes match restored app_secrets.env")
          PY
          )"
          echo "${ACTUAL_HASHES}"
          stale_admin="$(curl --silent --show-error -o /dev/null -w "%{http_code}" -b /tmp/compose-cookies http://127.0.0.1:8001/admin)"
          if [ "${stale_admin}" != "303" ] && [ "${stale_admin}" != "401" ] && [ "${stale_admin}" != "302" ]; then
            echo "Expected pre-restart session rejected after SECRET_KEY restore; got ${stale_admin}"
            docker compose logs dns-api || true
            docker compose down -v --remove-orphans || true
            exit 1
          fi
          curl --fail --silent -c /tmp/compose-cookies-restored -X POST http://127.0.0.1:8001/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Origin: http://127.0.0.1:8001" \
            -H "Referer: http://127.0.0.1:8001/login" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          curl --fail --silent -b /tmp/compose-cookies-restored http://127.0.0.1:8001/admin \
            | python3 -c "import sys; assert 'api-to-dns Dashboard' in sys.stdin.read()"
          docker compose down -v --remove-orphans

          echo "BIND smoke on Linux completed successfully."

  microsoft-dns-smoke-windows:
    name: Local Microsoft DNS WinRM smoke (windows, native API + PowerShell)
    runs-on: windows-2025
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Microsoft DNS on runner and prepare local WinRM test user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Installing DNS Server role...'
          Install-WindowsFeature -Name DNS -IncludeManagementTools | Out-Null

          Write-Host 'Enabling WinRM / PS remoting...'
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          winrm quickconfig -quiet -force

          # Required so a non-built-in local admin / DnsAdmins member gets a full token
          # over the network. Without this WSMan returns w:AccessDenied (wsmanfault 5)
          # even when NTLM auth itself succeeds.
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
            -Name LocalAccountTokenFilterPolicy -PropertyType DWord -Value 1 -Force | Out-Null

          # NTLM to 127.0.0.1 from a non-domain client requires TrustedHosts.
          Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value '127.0.0.1,localhost' -Force

          # KB 896861: disable NTLM loopback check (anti-reflection) so NTLM auth
          # to 127.0.0.1 / localhost / non-canonical names does not fail with
          # AccessDenied (wsmanfault 5). Required when the URL hostname differs
          # from the machine's actual NetBIOS name.
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
            -Name DisableLoopbackCheck -PropertyType DWord -Value 1 -Force | Out-Null

          Restart-Service WinRM

          $userName = 'gh-dns-smoke'
          Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          $plain = -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 28 | ForEach-Object { [char]$_ })
          $sec = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $userName -Password $sec -AccountNeverExpires -PasswordNeverExpires `
            -UserMayNotChangePassword -ErrorAction Stop
          foreach ($g in @('DnsAdmins', 'DNSAdmins')) {
            $lg = Get-LocalGroup -Name $g -ErrorAction SilentlyContinue
            if ($lg) {
              Add-LocalGroupMember -Group $g -Member $userName -ErrorAction Stop
              break
            }
          }
          Add-LocalGroupMember -Group 'Remote Management Users' -Member $userName -ErrorAction Stop
          # pywinrm calls the WS-Man Shell URI; its RootSDDL only grants
          # BUILTIN\Administrators by default. Remote Management Users covers
          # the PSRemoting endpoint but not the raw Shell endpoint. Add the
          # ephemeral CI user to Administrators so it can create a shell.
          # LocalAccountTokenFilterPolicy=1 ensures it gets a full token.
          Add-LocalGroupMember -Group 'Administrators' -Member $userName -ErrorAction SilentlyContinue

          Import-Module DnsServer
          foreach ($z in @('local-smoke.test', 'local-denied.test')) {
            if (Get-DnsServerZone -Name $z -ErrorAction SilentlyContinue) {
              Remove-DnsServerZone -Name $z -Force
            }
            Add-DnsServerPrimaryZone -Name $z -ZoneFile "$z.dns" -ErrorAction Stop
          }

          # #region agent diagnostics (keep until WinRM smoke is confirmed green)
          Write-Host '--- WinRM diagnostics ---'
          $tokenPolicy = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue).LocalAccountTokenFilterPolicy
          Write-Host "LocalAccountTokenFilterPolicy = $tokenPolicy"
          Write-Host "TrustedHosts = $((Get-Item WSMan:\localhost\Client\TrustedHosts).Value)"
          Write-Host "WinRM service status = $((Get-Service WinRM).Status)"
          (Get-LocalGroupMember -Group 'Remote Management Users' -ErrorAction SilentlyContinue) | ForEach-Object { Write-Host "RemoteMgmt member: $($_.Name)" }
          (Get-LocalGroupMember -Group 'DnsAdmins' -ErrorAction SilentlyContinue) | ForEach-Object { Write-Host "DnsAdmins member: $($_.Name)" }
          (Get-LocalGroupMember -Group 'Administrators' -ErrorAction SilentlyContinue) | ForEach-Object { Write-Host "Administrators member: $($_.Name)" }
          try { Test-WSMan -ComputerName 127.0.0.1 -ErrorAction Stop | Out-Null; Write-Host 'Test-WSMan 127.0.0.1: OK' } catch { Write-Host "Test-WSMan 127.0.0.1 failed: $($_.Exception.Message)" }
          # Authenticated PSRemoting probe with the same creds pywinrm will use.
          # If this prints the user, NTLM auth + WinRM shell creation work; any
          # subsequent failure must be in pywinrm transport or DNS cmdlet rights.
          try {
            $probeCred = New-Object System.Management.Automation.PSCredential(("$($env:COMPUTERNAME)\$userName"), $sec)
            $who = Invoke-Command -ComputerName $env:COMPUTERNAME -Credential $probeCred -Authentication Negotiate -ScriptBlock { whoami } -ErrorAction Stop
            Write-Host "Invoke-Command (as gh-dns-smoke) whoami: $who"
          } catch {
            Write-Host "Invoke-Command (as gh-dns-smoke) failed: $($_.Exception.Message)"
          }
          # #endregion agent diagnostics

          Write-Output "::add-mask::$plain"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_WINRM_USER=$userName"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_WINRM_PASSWORD=$plain"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_ALLOWED_ZONE=local-smoke.test"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_DENIED_ZONE=local-denied.test"

      - name: Prepare .env with Fernet encryption and session secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Force .env.example .env
          $key = (& python -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())").Trim()
          $secret = (& python -c "import secrets; print(secrets.token_urlsafe(32))").Trim()
          $text = (Get-Content .env -Raw) -replace 'ENCRYPTION_KEY=.*', "ENCRYPTION_KEY=$key"
          $text = $text -replace 'SECRET_KEY=.*', "SECRET_KEY=$secret"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) '.env'), $text, $utf8)

      - name: Microsoft smoke (PowerShell HTTP + native API)
        shell: pwsh
        env:
          REMOTE_WINRM_HOST: ${{ secrets.MICROSOFT_DNS_WINRM_HOST }}
          REMOTE_WINRM_USER: ${{ secrets.MICROSOFT_DNS_WINRM_USER }}
          REMOTE_WINRM_PASSWORD: ${{ secrets.MICROSOFT_DNS_WINRM_PASSWORD }}
          REMOTE_WINRM_SSL: ${{ secrets.MICROSOFT_DNS_WINRM_SSL }}
          REMOTE_QUERY_HOST: ${{ secrets.MICROSOFT_DNS_QUERY_HOST }}
          REMOTE_ALLOWED_ZONE: smoke.ms.lab
          REMOTE_DENIED_ZONE: denied.ms.lab
          INPUT_QUERY_SERVER: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          Set-Location $workspace

          $base = 'http://127.0.0.1:8000'
          $apiProcess = $null
          $apiOut = Join-Path $env:RUNNER_TEMP 'api-to-dns-uvicorn.out.log'
          $apiErr = Join-Path $env:RUNNER_TEMP 'api-to-dns-uvicorn.err.log'

          function Wait-LoginPage {
            param([int]$MaxAttempts = 60)
            for ($i = 0; $i -lt $MaxAttempts; $i++) {
              try {
                $null = Invoke-WebRequest -Uri "$base/login" -UseBasicParsing -TimeoutSec 5
                return
              }
              catch { Start-Sleep -Seconds 2 }
            }
            throw 'API did not become ready on :8000/login'
          }

          function Invoke-FormPost {
            param(
              [Parameter(Mandatory)] [string] $Uri,
              $WebSession,
              [Parameter(Mandatory)] [hashtable] $Form,
              [int] $MaximumRedirection = 10
            )
            $pairs = $Form.GetEnumerator() | ForEach-Object {
              '{0}={1}' -f $_.Key, [uri]::EscapeDataString([string]$_.Value)
            }
            $body = $pairs -join '&'
            # Same-origin CSRF checks require Origin/Referer to match Host.
            $uriObj = [uri]$Uri
            $origin = '{0}://{1}' -f $uriObj.Scheme, $uriObj.Authority
            return Invoke-WebRequest -Uri $Uri -WebSession $WebSession -Method Post -Body $body `
              -ContentType 'application/x-www-form-urlencoded' -UseBasicParsing -MaximumRedirection $MaximumRedirection -SkipHttpErrorCheck `
              -Headers @{ Origin = $origin; Referer = $Uri }
          }

          function Get-ZoneIdFromApiKeysHtml {
            param([string] $Html, [string] $ZoneFqdn)
            $esc = [regex]::Escape($ZoneFqdn)
            $m = [regex]::Match($Html, "name=`"zone_ids`" value=`"(\d+)`"\s*/>\s*<code>$esc</code>", 'Singleline,IgnoreCase')
            if (-not $m.Success) { throw "Could not find zone id for $ZoneFqdn" }
            return [int]$m.Groups[1].Value
          }

          function Get-ApiKeyFromCreateHtml {
            param([string] $Html)
            $m = [regex]::Match($Html, 'data-created-api-key="([^"]+)"')
            if (-not $m.Success) {
              $m = [regex]::Match($Html, 'API key created:\s*([^<\s]+)')
            }
            if (-not $m.Success) { throw 'Could not extract API key from HTML' }
            return $m.Groups[1].Value
          }

          function Invoke-DnsRecord {
            param(
              [string] $ApiKey,
              [int] $ExpectedStatus,
              [string] $Method = 'POST',
              [hashtable] $JsonBody,
              [hashtable] $Query
            )
            $url = "$base/dns-record"
            if ($Query) {
              $pairs = $Query.GetEnumerator() | ForEach-Object {
                '{0}={1}' -f $_.Key, [uri]::EscapeDataString([string]$_.Value)
              }
              $url = "$url`?" + ($pairs -join '&')
            }
            $args = @{
              Uri               = $url
              Method            = $Method
              Headers           = @{ 'X-API-Key' = $ApiKey }
              UseBasicParsing   = $true
              SkipHttpErrorCheck = $true
            }
            if ($JsonBody) {
              $args.Body = ($JsonBody | ConvertTo-Json -Compress -Depth 6)
              $args.ContentType = 'application/json'
            }
            $label = "$Method /dns-record"
            if ($JsonBody) {
              $label = "$label $($JsonBody.zone_name) $($JsonBody.record_type) $($JsonBody.record_name)"
            }
            elseif ($Query) {
              $label = "$label $($Query.zone_name) $($Query.record_type) $($Query.record_name)"
            }
            Write-Host "[microsoft] $label expecting HTTP $ExpectedStatus"
            $resp = Invoke-WebRequest @args
            Write-Host "[microsoft] $label returned HTTP $($resp.StatusCode)"
            if ([int]$resp.StatusCode -ne $ExpectedStatus) {
              throw "dns-record expected HTTP $ExpectedStatus got $($resp.StatusCode): $($resp.Content)"
            }
            return $resp.Content | ConvertFrom-Json
          }

          function Assert-DnsRecordAction {
            param($Json, [string] $ExpectedAction)
            if ($ExpectedAction -eq 'access_denied') {
              if ($Json.detail.error -ne 'access_denied') { throw "expected access_denied: $($Json | ConvertTo-Json -Compress)" }
            }
            elseif ($Json.action -ne $ExpectedAction) {
              throw "expected action $ExpectedAction got $($Json | ConvertTo-Json -Compress)"
            }
          }

          function Wait-LocalA {
            param([string] $Fqdn, [string] $ExpectedIp, [string] $DnsServer = '127.0.0.1')
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $DnsServer -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -ne $r -and $r.IPAddress -eq $ExpectedIp) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn -> $ExpectedIp on $DnsServer"
          }

          function Wait-LocalAbsent {
            param([string] $Fqdn, [string] $DnsServer = '127.0.0.1')
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $DnsServer -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -eq $r -or [string]::IsNullOrEmpty($r.IPAddress)) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn absent on $DnsServer"
          }

          function Wait-RemoteA {
            param([string] $Fqdn, [string] $ExpectedIp, [string] $Server)
            if ([string]::IsNullOrWhiteSpace($Server)) { return }
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $Server -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -ne $r -and $r.IPAddress -eq $ExpectedIp) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn -> $ExpectedIp via $Server"
          }

          function Wait-RemoteAbsent {
            param([string] $Fqdn, [string] $Server)
            if ([string]::IsNullOrWhiteSpace($Server)) { return }
            for ($i = 0; $i -lt 30; $i++) {
              $r = Resolve-DnsName -Name $Fqdn -Type A -DnsOnly -Server $Server -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -eq $r -or [string]::IsNullOrEmpty($r.IPAddress)) { return }
              Start-Sleep -Seconds 2
            }
            throw "Expected $Fqdn absent at $Server"
          }

          try {
            $python = (Get-Command python -ErrorAction Stop).Source
            $envFile = Join-Path $workspace '.env'
            $apiArgs = @(
              '-m', 'uvicorn', 'src.app:app',
              '--host', '127.0.0.1',
              '--port', '8000',
              '--env-file', $envFile
            )
            $apiProcess = Start-Process -FilePath $python -ArgumentList $apiArgs -WorkingDirectory $workspace `
              -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr -PassThru
            Write-Host "Started native API process $($apiProcess.Id)."

            Wait-LoginPage

            Write-Host '[microsoft] GET /login and start admin session'
            $null = Invoke-WebRequest -Uri "$base/login" -UseBasicParsing -SessionVariable 'WebSession'
            Write-Host '[microsoft] POST /login as admin'
            $login = Invoke-FormPost -Uri "$base/login" -WebSession $WebSession -Form @{
              username = 'admin'
              password = 'your-admin-password'
            }
            if ($login.StatusCode -notin @(200, 303)) {
              throw "Login POST unexpected status $($login.StatusCode)"
            }

            Write-Host '[microsoft] GET /admin'
            $admin = Invoke-WebRequest -Uri "$base/admin" -WebSession $WebSession -UseBasicParsing
            if ($admin.Content -notmatch 'api-to-dns Dashboard') {
              throw 'Admin page did not contain expected title (session or credentials).'
            }
            if ($admin.Content -notmatch 'Configured zones') {
              throw 'Admin page missing Configured zones section'
            }
            $nav = ($admin.Content -split '<nav class="nav-links">', 2)[1] -split '</nav>', 2 | Select-Object -First 1
            if ($nav.IndexOf('href="/api-keys"') -ge $nav.IndexOf('href="/admin"') -or
                $nav.IndexOf('href="/admin"') -ge $nav.IndexOf('href="/settings"') -or
                $nav.IndexOf('href="/settings"') -ge $nav.IndexOf('action="/logout"')) {
              throw 'Admin header navigation order is not API Keys, Dashboard, Settings, Logout'
            }
            $appVersion = (Get-Content -Raw VERSION).Trim()
            if ($appVersion -ne '0.8.5') { throw "Expected VERSION 0.8.5; got $appVersion" }
            if ($admin.Content -notmatch [regex]::Escape("api-to-dns v$appVersion")) {
              throw 'Admin page missing version footer'
            }

            Write-Host '[microsoft] Static brand assets (favicon + logo mark)'
            foreach ($asset in @(
              @{ Name = 'favicon'; Uri = "$base/static/favicon.svg?v=2" },
              @{ Name = 'logo-mark'; Uri = "$base/static/logo-mark.svg?v=2" }
            )) {
              $resp = Invoke-WebRequest -Uri $asset.Uri -WebSession $WebSession -UseBasicParsing
              if ($resp.StatusCode -ne 200) {
                throw "Expected 200 for $($asset.Name); got $($resp.StatusCode)"
              }
              $ct = [string]$resp.Headers['Content-Type']
              if ($ct -notmatch 'image/svg\+xml') {
                throw "Expected image/svg+xml for $($asset.Name); got '$ct'"
              }
              if ($resp.Content -notmatch '(?i)<svg') {
                throw "$($asset.Name) body missing <svg>"
              }
              try {
                [xml]$resp.Content | Out-Null
              } catch {
                throw "$($asset.Name) body is not well-formed XML: $_"
              }
            }

            # PowerShell does not treat \ as an escape, so ".\\$user" produced a literal
            # ".\\gh-dns-smoke" (two backslashes). NTLM (requests-ntlm) needs domain\user
            # with a single backslash; for a local account use computername\user.
            $localUser = "$($env:COMPUTERNAME)\$($env:LOCAL_WINRM_USER)"
            $localPass = $env:LOCAL_WINRM_PASSWORD
            $la = $env:LOCAL_ALLOWED_ZONE
            $ld = $env:LOCAL_DENIED_ZONE
            # Use the machine's NetBIOS name (not 127.0.0.1) so NTLM SPN matches and
            # the loopback check (KB 896861) is not triggered.
            $localDnsServer = $env:COMPUTERNAME

            # #region agent diagnostics (keep until WinRM smoke is confirmed green)
            Write-Host "Local WinRM user (sanitized): $($env:COMPUTERNAME)\<user>"
            Write-Host "Local WinRM user backslash count: $((($localUser -split '\\').Count - 1))"
            Write-Host "Local DNS/WinRM target = $localDnsServer"
            $tokenPolicy = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue).LocalAccountTokenFilterPolicy
            $loopback   = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name DisableLoopbackCheck -ErrorAction SilentlyContinue).DisableLoopbackCheck
            Write-Host "LocalAccountTokenFilterPolicy = $tokenPolicy ; DisableLoopbackCheck = $loopback"
            Write-Host "TrustedHosts = $((Get-Item WSMan:\localhost\Client\TrustedHosts).Value)"
            try { Test-WSMan -ComputerName $localDnsServer -ErrorAction Stop | Out-Null; Write-Host "Test-WSMan $localDnsServer : OK" } catch { Write-Host "Test-WSMan $localDnsServer failed: $($_.Exception.Message)" }
            # #endregion agent diagnostics

            foreach ($z in @($la, $ld)) {
              Write-Host "[microsoft-local] Configure zone $z"
              $zoneResp = Invoke-FormPost -Uri "$base/zones" -WebSession $WebSession -Form @{
                zone_name           = $z
                dns_zone            = $z
                dns_provider_type   = 'microsoft'
                dns_server          = $localDnsServer
                dns_username        = $localUser
                dns_password        = $localPass
              }
              if ($zoneResp.StatusCode -ne 200 -or (
                $zoneResp.Content -notmatch "Zone '$([regex]::Escape($z))' added" -and
                $zoneResp.Content -notmatch "Zone &#39;$([regex]::Escape($z))&#39; added"
              )) {
                Write-Host "[microsoft-local] Zone create response excerpt:"
                Write-Host $zoneResp.Content.Substring(0, [Math]::Min(1200, $zoneResp.Content.Length))
                throw "Zone create failed for ${z}: HTTP $($zoneResp.StatusCode)"
              }
            }

            Write-Host '[microsoft-local] GET /api-keys'
            $keysHtml = (Invoke-WebRequest -Uri "$base/api-keys" -WebSession $WebSession -UseBasicParsing).Content
            $zoneId = Get-ZoneIdFromApiKeysHtml -Html $keysHtml -ZoneFqdn $la

            Write-Host '[microsoft-local] POST /api-keys'
            $createKey = Invoke-FormPost -Uri "$base/api-keys" -WebSession $WebSession -MaximumRedirection 10 -Form @{
              label       = 'ms-local-smoke'
              access_mode = 'read_write'
              zone_ids    = "$zoneId"
            }
            $msLocalKey = Get-ApiKeyFromCreateHtml -Html $createKey.Content
            $createReadOnlyKey = Invoke-FormPost -Uri "$base/api-keys" -WebSession $WebSession -MaximumRedirection 10 -Form @{
              label       = 'ms-local-read-only'
              access_mode = 'read_only'
              zone_ids    = "$zoneId"
            }
            $msLocalReadOnlyKey = Get-ApiKeyFromCreateHtml -Html $createReadOnlyKey.Content

            Write-Host '[microsoft-local] GET /keycheck'
            $kc = Invoke-RestMethod -Uri "$base/keycheck" -Headers @{ 'X-API-Key' = $msLocalKey }
            if ($kc.status -ne 'success') { throw 'keycheck failed' }

            Write-Host '[microsoft-local] JSON GET /zones'
            $zonesJson = Invoke-RestMethod -Uri "$base/zones" -Headers @{
              'Accept'   = 'application/json'
              'X-API-Key' = $msLocalKey
            }
            $zoneNames = @(@($zonesJson) | ForEach-Object { $_.zone_name })
            if ($zoneNames -notcontains $la) {
              throw "JSON GET /zones missing allowed zone $la"
            }
            if ($zoneNames -contains $ld) {
              throw "JSON GET /zones leaked denied zone ${ld}: $($zoneNames -join ', ')"
            }
            if (@($zoneNames).Count -ne 1 -or $zoneNames[0] -ne $la) {
              throw "JSON GET /zones expected exactly [$la]; got [$($zoneNames -join ', ')]"
            }
            try {
              Invoke-WebRequest -Uri "$base/zones" -Headers @{ Accept = 'application/json' } -UseBasicParsing -ErrorAction Stop | Out-Null
              throw 'JSON GET /zones without API key should fail'
            } catch {
              $code = $_.Exception.Response.StatusCode.value__
              if ($code -ne 403) { throw "Expected JSON GET /zones without key to return 403; got $code" }
            }

            $www = "www.$la"
            $jCreate  = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.10') }
            $jReplace = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.20') }
            $jPatchTtl = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; ttl = 450 }
            $jPatch   = @{ zone_name = $la; record_type = 'A'; record_name = 'www'; values = @('192.0.2.30') }
            $qDelete  = @{ zone_name = $la; record_name = 'www'; record_type = 'A' }
            $jDenied  = @{ zone_name = $ld; record_type = 'A'; record_name = 'blocked'; ttl = 300; values = @('192.0.2.55') }
            $jReadOnly = @{ zone_name = $la; record_type = 'A'; record_name = 'read-only'; ttl = 300; values = @('192.0.2.50') }

            $x = Invoke-DnsRecord -ApiKey $msLocalReadOnlyKey -ExpectedStatus 200 -Method GET -Query @{ zone_name = $la; record_name = 'read-only'; record_type = 'A' }
            if ($x.status -ne 'not_found') { throw "read-only API key lookup failed: $($x | ConvertTo-Json -Compress)" }
            $x = Invoke-DnsRecord -ApiKey $msLocalReadOnlyKey -ExpectedStatus 403 -Method POST -JsonBody $jReadOnly
            Assert-DnsRecordAction -Json $x -ExpectedAction 'access_denied'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method POST -JsonBody $jCreate
            Assert-DnsRecordAction -Json $x -ExpectedAction 'created'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.10'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method PATCH -JsonBody $jPatchTtl
            Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.10'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 409 -Method POST -JsonBody $jCreate
            Assert-DnsRecordAction -Json $x -ExpectedAction 'record_already_exists'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method PUT -JsonBody $jReplace
            Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.20'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method PATCH -JsonBody $jPatch
            Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
            Wait-LocalA -Fqdn $www -ExpectedIp '192.0.2.30'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method DELETE -Query $qDelete
            Assert-DnsRecordAction -Json $x -ExpectedAction 'deleted'
            Wait-LocalAbsent -Fqdn $www

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 404 -Method DELETE -Query $qDelete
            Assert-DnsRecordAction -Json $x -ExpectedAction 'not_found'

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 404 -Method PUT -JsonBody $jReplace
            Assert-DnsRecordAction -Json $x -ExpectedAction 'not_found'

            Write-Host '[microsoft-local] Apex FQDN record_name maps to the zone apex A'
            $jApex = @{ zone_name = $la; record_type = 'A'; record_name = $la; ttl = 300; values = @('192.0.2.80') }
            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method POST -JsonBody $jApex
            Assert-DnsRecordAction -Json $x -ExpectedAction 'created'
            Wait-LocalA -Fqdn $la -ExpectedIp '192.0.2.80'
            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method GET -Query @{ zone_name = $la; record_name = $la; record_type = 'A' }
            if ($x.status -ne 'success') { throw "apex FQDN lookup failed: $($x | ConvertTo-Json -Compress)" }
            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 200 -Method DELETE -Query @{ zone_name = $la; record_name = $la; record_type = 'A' }
            Assert-DnsRecordAction -Json $x -ExpectedAction 'deleted'
            Wait-LocalAbsent -Fqdn $la

            $x = Invoke-DnsRecord -ApiKey $msLocalKey -ExpectedStatus 403 -Method POST -JsonBody $jDenied
            Assert-DnsRecordAction -Json $x -ExpectedAction 'access_denied'

            Write-Host '[microsoft-local] Dashboard links to DNS browser and /zones redirects'
            $adminHtml = (Invoke-WebRequest -Uri "$base/admin" -WebSession $WebSession -UseBasicParsing).Content
            if ($adminHtml -notmatch [regex]::Escape("/zones/$zoneId/records")) { throw 'Dashboard missing DNS browser link' }
            try {
              Invoke-WebRequest -Uri "$base/zones" -WebSession $WebSession -UseBasicParsing -MaximumRedirection 0 -ErrorAction Stop | Out-Null
              throw 'Zones page should redirect to the dashboard'
            } catch {
              $code = $_.Exception.Response.StatusCode.value__
              $location = $_.Exception.Response.Headers.Location.OriginalString
              if ($code -ne 303 -or $location -ne '/admin') {
                throw "Expected /zones redirect to /admin; got $code $location"
              }
            }
            try {
              Invoke-WebRequest -Uri "$base/zones/$zoneId/records" -UseBasicParsing -MaximumRedirection 0 -ErrorAction Stop | Out-Null
              throw 'Unauthenticated DNS browser request should not succeed'
            } catch {
              $code = $_.Exception.Response.StatusCode.value__
              if ($code -notin 303, 401, 302) { throw "Expected unauthenticated DNS browser redirect/deny; got $code" }
            }

            Write-Host '[microsoft-local] Admin DNS browser session CRUD'
            $browserPage = (Invoke-WebRequest -Uri "$base/zones/$zoneId/records" -WebSession $WebSession -UseBasicParsing).Content
            if ($browserPage -notmatch 'dns-browser-search') { throw 'DNS browser page missing search form' }
            $browserHeaders = @{
              'Content-Type' = 'application/json'
              'Accept'       = 'application/json'
              'Origin'       = $base
              'Referer'      = "$base/zones/$zoneId/records"
            }
            $browserCreate = Invoke-WebRequest -Uri "$base/zones/$zoneId/records" -WebSession $WebSession -Method POST -Headers $browserHeaders -Body '{"record_name":"browser","record_type":"A","ttl":300,"values":["192.0.2.77"]}' -UseBasicParsing
            $bc = $browserCreate.Content | ConvertFrom-Json
            if ($bc.action -ne 'created') { throw "browser create failed: $($browserCreate.Content)" }
            Wait-LocalA -Fqdn "browser.$la" -ExpectedIp '192.0.2.77'
            $browserBrowse = Invoke-RestMethod -Uri "$base/zones/$zoneId/records/search" -WebSession $WebSession
            if ($browserBrowse.match_mode -ne 'browse' -or -not ($browserBrowse.records | Where-Object { $_.record_name -eq 'browser' -and $_.record_type -eq 'A' })) {
              throw "browser empty browse failed: $($browserBrowse | ConvertTo-Json -Compress -Depth 6)"
            }
            $browserGlob = Invoke-RestMethod -Uri "$base/zones/$zoneId/records/search?record_name=browser*&record_type=A" -WebSession $WebSession
            if ($browserGlob.match_mode -ne 'glob' -or $browserGlob.records[0].values[0] -ne '192.0.2.77') {
              throw "browser wildcard search failed: $($browserGlob | ConvertTo-Json -Compress -Depth 6)"
            }
            $browserQGlob = Invoke-RestMethod -Uri "$base/zones/$zoneId/records/search?record_name=BROW?ER&record_type=A" -WebSession $WebSession
            if ($browserQGlob.match_mode -ne 'glob' -or $browserQGlob.records[0].values[0] -ne '192.0.2.77') {
              throw "browser case-insensitive ? glob failed: $($browserQGlob | ConvertTo-Json -Compress -Depth 6)"
            }
            $browserSearch = Invoke-RestMethod -Uri "$base/zones/$zoneId/records/search?record_name=browser&record_type=A" -WebSession $WebSession
            if ($browserSearch.status -ne 'success' -or $browserSearch.records[0].values[0] -ne '192.0.2.77') {
              throw "browser search failed: $($browserSearch | ConvertTo-Json -Compress)"
            }
            $browserReplace = Invoke-WebRequest -Uri "$base/zones/$zoneId/records" -WebSession $WebSession -Method PUT -Headers $browserHeaders -Body '{"record_name":"browser","record_type":"A","ttl":300,"values":["192.0.2.78"]}' -UseBasicParsing
            $br = $browserReplace.Content | ConvertFrom-Json
            if ($br.action -ne 'updated') { throw "browser replace failed: $($browserReplace.Content)" }
            Wait-LocalA -Fqdn "browser.$la" -ExpectedIp '192.0.2.78'
            $browserDelete = Invoke-WebRequest -Uri "$base/zones/$zoneId/records" -WebSession $WebSession -Method DELETE -Headers $browserHeaders -Body '{"record_name":"browser","record_type":"A"}' -UseBasicParsing
            $bd = $browserDelete.Content | ConvertFrom-Json
            if ($bd.action -ne 'deleted') { throw "browser delete failed: $($browserDelete.Content)" }
            Wait-LocalAbsent -Fqdn "browser.$la"

            if ($env:REMOTE_WINRM_HOST -and $env:REMOTE_WINRM_USER -and $env:REMOTE_WINRM_PASSWORD) {
              Write-Host '=== Remote Microsoft DNS (secrets) ==='
              $remoteDig = $env:INPUT_QUERY_SERVER
              if ([string]::IsNullOrWhiteSpace($remoteDig)) { $remoteDig = $env:REMOTE_QUERY_HOST }

              $ra = $env:REMOTE_ALLOWED_ZONE
              $rd = $env:REMOTE_DENIED_ZONE
              foreach ($z in @($ra, $rd)) {
                Write-Host "[microsoft-remote] Configure zone $z"
                $form = @{
                  zone_name           = $z
                  dns_zone            = $z
                  dns_provider_type   = 'microsoft'
                  dns_server          = $env:REMOTE_WINRM_HOST
                  dns_username        = $env:REMOTE_WINRM_USER
                  dns_password        = $env:REMOTE_WINRM_PASSWORD
                }
                if ($env:REMOTE_WINRM_SSL -in @('true', 'True', '1')) {
                  $form['dns_winrm_ssl'] = 'true'
                  # Ephemeral self-signed lab hosts only; production must leave this unchecked.
                  $form['dns_winrm_insecure_tls'] = 'true'
                }
                $zoneResp = Invoke-FormPost -Uri "$base/zones" -WebSession $WebSession -Form $form
                if ($zoneResp.StatusCode -ne 200 -or (
                  $zoneResp.Content -notmatch "Zone '$([regex]::Escape($z))' added" -and
                  $zoneResp.Content -notmatch "Zone &#39;$([regex]::Escape($z))&#39; added"
                )) {
                  Write-Host "[microsoft-remote] Zone create response excerpt:"
                  Write-Host $zoneResp.Content.Substring(0, [Math]::Min(1200, $zoneResp.Content.Length))
                  throw "Remote zone create failed for ${z}: HTTP $($zoneResp.StatusCode)"
                }
              }

              Write-Host '[microsoft-remote] GET /api-keys'
              $keysHtml2 = (Invoke-WebRequest -Uri "$base/api-keys" -WebSession $WebSession -UseBasicParsing).Content
              $rZoneId = Get-ZoneIdFromApiKeysHtml -Html $keysHtml2 -ZoneFqdn $ra
              Write-Host '[microsoft-remote] POST /api-keys'
              $rk = Invoke-FormPost -Uri "$base/api-keys" -WebSession $WebSession -MaximumRedirection 10 -Form @{ label = 'ms-remote-smoke'; access_mode = 'read_write'; zone_ids = "$rZoneId" }
              $msRemoteKey = Get-ApiKeyFromCreateHtml -Html $rk.Content

              $rWww = "www.$ra"
              $rjC = @{ zone_name = $ra; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.10') }
              $rjU = @{ zone_name = $ra; record_type = 'A'; record_name = 'www'; ttl = 300; values = @('192.0.2.20') }
              $rqD = @{ zone_name = $ra; record_name = 'www'; record_type = 'A' }
              $rjX = @{ zone_name = $rd; record_type = 'A'; record_name = 'blocked'; ttl = 300; values = @('192.0.2.55') }

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 200 -Method POST -JsonBody $rjC
              Assert-DnsRecordAction -Json $x -ExpectedAction 'created'
              Wait-RemoteA -Fqdn $rWww -ExpectedIp '192.0.2.10' -Server $remoteDig

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 200 -Method PUT -JsonBody $rjU
              Assert-DnsRecordAction -Json $x -ExpectedAction 'updated'
              Wait-RemoteA -Fqdn $rWww -ExpectedIp '192.0.2.20' -Server $remoteDig

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 200 -Method DELETE -Query $rqD
              Assert-DnsRecordAction -Json $x -ExpectedAction 'deleted'
              Wait-RemoteAbsent -Fqdn $rWww -Server $remoteDig

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 404 -Method DELETE -Query $rqD
              Assert-DnsRecordAction -Json $x -ExpectedAction 'not_found'

              $x = Invoke-DnsRecord -ApiKey $msRemoteKey -ExpectedStatus 403 -Method POST -JsonBody $rjX
              Assert-DnsRecordAction -Json $x -ExpectedAction 'access_denied'
            }
            else {
              Write-Host '=== Remote Microsoft DNS skipped (set MICROSOFT_DNS_WINRM_* secrets) ==='
            }

            Write-Host 'Microsoft smoke (native API + PowerShell HTTP) completed successfully.'
          }
          finally {
            if ($apiProcess -and -not $apiProcess.HasExited) {
              Stop-Process -Id $apiProcess.Id -Force -ErrorAction SilentlyContinue
            }
            foreach ($log in @($apiOut, $apiErr)) {
              if (Test-Path $log) {
                Write-Host "=== $log ==="
                Get-Content $log | Write-Host
              }
            }
          }
