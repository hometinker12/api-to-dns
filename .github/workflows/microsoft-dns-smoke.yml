# Manual smoke on **develop**: (1) BIND + Docker API on **ubuntu-latest** — same as release CI.
# (2) Hosted Microsoft DNS + **native Python** API on **windows-2025** — GitHub Windows Docker is
# **Windows-only** and cannot load/run Linux images ("cannot load linux image on windows"), so the
# API runs in a venv + uvicorn; WinRM targets **127.0.0.1** for local DnsServer cmdlets.
#
# Optional remote lab (secrets): MICROSOFT_DNS_WINRM_HOST, USER, PASSWORD, SSL, QUERY_HOST
#
# Run from branch `develop`. Workflow file must exist on the default branch to appear in the UI.

name: Microsoft DNS manual smoke (develop)

on:
  workflow_dispatch:
    inputs:
      allowed_zone:
        description: "Remote lab: Microsoft primary zone FQDN (requires WinRM secrets)"
        required: true
        default: "smoke.ms.lab"
      denied_zone:
        description: "Remote lab: second zone FQDN for denied-zone API test"
        required: true
        default: "denied.ms.lab"
      dns_query_server:
        description: "Remote lab: optional Resolve-DnsName -Server target (IP or hostname)"
        required: false
        default: ""

jobs:
  bind-smoke-linux:
    name: BIND smoke (ubuntu + Docker)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Copy env example for testing
        run: cp .env.example .env

      - name: Generate encryption key for testing
        run: |
          KEY="$(python3 - <<'PY'
          import base64
          import os

          print(base64.urlsafe_b64encode(os.urandom(32)).decode())
          PY
          )"
          sed -i "s|ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${KEY}|" .env
          echo 'Generated encryption key for testing'

      - name: Build the Docker image
        run: |
          IMAGE_TAG="api-to-dns-bind-smoke:$(date +%s)"
          docker build . --file Dockerfile --tag "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Run BIND-backed smoke test
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          NETWORK_NAME="dns-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BIND_DIR="${RUNNER_TEMP}/bind-smoke"
          TSIG_NAME="api-to-dns."
          TSIG_SECRET="MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

          cleanup() {
            echo "Collecting container logs..."
            docker logs dns-api-test 2>/dev/null || true
            docker logs bind-test 2>/dev/null || true
            docker rm -f dns-api-test bind-test 2>/dev/null || true
            docker network rm "${NETWORK_NAME}" 2>/dev/null || true
          }
          trap cleanup EXIT

          mkdir -p "${BIND_DIR}"
          python3 - "${BIND_DIR}" "${TSIG_NAME}" "${TSIG_SECRET}" <<'PY'
          import sys
          from pathlib import Path

          bind_dir = Path(sys.argv[1])
          tsig_name = sys.argv[2]
          tsig_secret = sys.argv[3]

          named_conf = (
              'key "' + tsig_name + '" {\n'
              "  algorithm hmac-sha256;\n"
              '  secret "' + tsig_secret + '";\n'
              "};\n"
              "\n"
              "options {\n"
              '  directory "/bind";\n'
              "  listen-on port 53 { any; };\n"
              "  listen-on-v6 { none; };\n"
              "  allow-query { any; };\n"
              "  recursion no;\n"
              "  dnssec-validation no;\n"
              "};\n"
              "\n"
              'zone "smoke.test" {\n'
              "  type master;\n"
              '  file "/bind/db.smoke.test";\n'
              '  allow-update { key "' + tsig_name + '"; };\n'
              "};\n"
              "\n"
              'zone "denied.test" {\n'
              "  type master;\n"
              '  file "/bind/db.denied.test";\n'
              '  allow-update { key "' + tsig_name + '"; };\n'
              "};\n"
          )

          zone_smoke = """$TTL 300
          @ IN SOA ns.smoke.test. hostmaster.smoke.test. (
            1 ; serial
            300 ; refresh
            300 ; retry
            300 ; expire
            300 ; minimum
          )
          @ IN NS ns.smoke.test.
          ns IN A 127.0.0.1
          """

          zone_denied = """$TTL 300
          @ IN SOA ns.denied.test. hostmaster.denied.test. (
            1 ; serial
            300 ; refresh
            300 ; retry
            300 ; expire
            300 ; minimum
          )
          @ IN NS ns.denied.test.
          ns IN A 127.0.0.1
          """

          def _unindent(s: str) -> str:
              return "\n".join(line.lstrip() for line in s.splitlines()).strip() + "\n"

          (bind_dir / "named.conf").write_text(_unindent(named_conf), newline="\n")
          (bind_dir / "db.smoke.test").write_text(_unindent(zone_smoke), newline="\n")
          (bind_dir / "db.denied.test").write_text(_unindent(zone_denied), newline="\n")
          PY

          chmod -R a+rwX "${BIND_DIR}"
          docker network create "${NETWORK_NAME}"

          docker run -d --name bind-test --network "${NETWORK_NAME}" \
            -e BIND9_USER=root \
            -v "${BIND_DIR}:/bind:rw" \
            ubuntu/bind9:9.18-22.04_edge \
            -c /bind/named.conf

          for i in $(seq 1 60); do
            if docker exec bind-test ss -lun 2>/dev/null | grep -q ':53'; then
              break
            fi
            if [ -z "$(docker ps -q -f name=bind-test -f status=running)" ]; then
              echo "BIND container exited before becoming ready"
              docker logs bind-test 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          if ! docker exec bind-test ss -lun 2>/dev/null | grep -q ':53'; then
            echo "BIND did not open port 53 in time"
            docker logs bind-test 2>&1 | tail -n 200 || true
            exit 1
          fi

          docker exec bind-test bash -lc 'DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -qq -y dnsutils'

          for i in $(seq 1 30); do
            if docker exec bind-test dig @127.0.0.1 smoke.test SOA +short >/tmp/bind-soa.txt 2>/dev/null && [ -s /tmp/bind-soa.txt ]; then
              break
            fi
            if [ -z "$(docker ps -q -f name=bind-test -f status=running)" ]; then
              echo "BIND container exited during dnsutils install or query wait"
              docker logs bind-test 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          if [ ! -s /tmp/bind-soa.txt ]; then
            echo "dig did not return SOA for smoke.test"
            docker logs bind-test 2>&1 | tail -n 200 || true
            exit 1
          fi

          docker run -d --name dns-api-test --network "${NETWORK_NAME}" --env-file .env -p 8000:8000 "$IMAGE_TAG"

          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://localhost:8000/login >/dev/null; then
              break
            fi
            if [ -z "$(docker ps -q -f name=dns-api-test -f status=running)" ]; then
              echo "API container exited before becoming ready"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent -c /tmp/cookies -X POST http://localhost:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          curl --fail --silent -b /tmp/cookies http://localhost:8000/admin | python3 -c "import sys; assert 'DNS Admin Dashboard' in sys.stdin.read()"

          for zone in smoke.test denied.test; do
            curl --fail --silent -b /tmp/cookies -X POST http://localhost:8000/zones \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "zone_name=${zone}" \
              --data-urlencode "dns_provider_type=bind" \
              --data-urlencode "dns_server=bind-test" \
              --data-urlencode "dns_username=${TSIG_NAME}" \
              --data-urlencode "dns_password=${TSIG_SECRET}" \
              --data-urlencode "dns_tsig_algorithm=hmac-sha256" \
              -o /dev/null
          done

          curl --fail --silent -b /tmp/cookies http://localhost:8000/api-keys -o /tmp/api-keys.html
          SMOKE_ZONE_ID="$(python3 - <<'PY'
          import re

          html = open('/tmp/api-keys.html', encoding='utf-8').read()
          match = re.search(r'name="zone_ids" value="(\d+)"\s*/>\s*<code>smoke\.test</code>', html, re.DOTALL)
          if not match:
              raise SystemExit("Could not find smoke.test zone ID")
          print(match.group(1))
          PY
          )"

          curl --fail --silent -L -b /tmp/cookies -X POST http://localhost:8000/api-keys \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "label=bind-smoke-test" \
            --data-urlencode "zone_ids=${SMOKE_ZONE_ID}" \
            -o /tmp/api-key-create.html

          API_KEY="$(python3 - <<'PY'
          import re

          html = open('/tmp/api-key-create.html', encoding='utf-8').read()
          match = re.search(r'API key created:\s*([^<\s]+)', html)
          if not match:
              raise SystemExit("Could not extract API key")
          print(match.group(1))
          PY
          )"

          curl --fail --silent -H "X-API-Key: $API_KEY" http://localhost:8000/keycheck \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['status'] == 'success'"

          call_dns_api() {
            local expected_status="$1"
            local expected_action="$2"
            local body="$3"
            local output="/tmp/dns-response-${expected_action}.json"
            local status

            status="$(curl --silent --show-error -o "${output}" -w "%{http_code}" \
              -X POST http://localhost:8000/dns-record \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ${API_KEY}" \
              -d "${body}")"

            echo "${expected_action}: HTTP ${status}"
            cat "${output}"
            echo

            if [ "${status}" != "${expected_status}" ]; then
              echo "Expected HTTP ${expected_status}, got ${status}"
              exit 1
            fi

            python3 -c "import json,sys;b=json.load(open(sys.argv[1],encoding='utf-8'));e=sys.argv[2];assert((e=='access_denied' and b['detail']['error']=='access_denied') or (b['action']==e)),b" "${output}" "${expected_action}"
          }

          wait_for_record_value() {
            local fqdn="$1"
            local expected="$2"
            local value=""
            for i in $(seq 1 20); do
              value="$(docker exec bind-test dig @127.0.0.1 "${fqdn}" A +short | tr -d '\r' | tail -n 1 || true)"
              if [ "${value}" = "${expected}" ]; then
                return 0
              fi
              sleep 1
            done
            echo "Expected ${fqdn} to resolve to ${expected}; got '${value}'"
            exit 1
          }

          wait_for_record_absent() {
            local fqdn="$1"
            local value=""
            for i in $(seq 1 20); do
              value="$(docker exec bind-test dig @127.0.0.1 "${fqdn}" A +short | tr -d '\r' || true)"
              if [ -z "${value}" ]; then
                return 0
              fi
              sleep 1
            done
            echo "Expected ${fqdn} to be absent; got '${value}'"
            exit 1
          }

          call_dns_api 200 created '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.10"]}'
          wait_for_record_value www.smoke.test 192.0.2.10
          call_dns_api 200 updated '{"zone_name":"smoke.test","record_type":"A","record_name":"www","ttl":300,"values":["192.0.2.20"]}'
          wait_for_record_value www.smoke.test 192.0.2.20
          call_dns_api 200 deleted '{"zone_name":"smoke.test","record_type":"DELETE","record_name":"www","values":["A"]}'
          wait_for_record_absent www.smoke.test
          call_dns_api 404 not_found '{"zone_name":"smoke.test","record_type":"DELETE","record_name":"www","values":["A"]}'
          call_dns_api 403 access_denied '{"zone_name":"denied.test","record_type":"A","record_name":"blocked","ttl":300,"values":["192.0.2.55"]}'

          echo "BIND smoke on Linux completed successfully."

  microsoft-dns-smoke-windows:
    name: Local + remote Microsoft (windows, native API)
    runs-on: windows-2025
    if: github.ref == 'refs/heads/develop'
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Microsoft DNS on runner and prepare local WinRM test user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Installing DNS Server role...'
          Install-WindowsFeature -Name DNS -IncludeManagementTools | Out-Null

          Write-Host 'Enabling WinRM / PS remoting...'
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          winrm quickconfig -quiet -force

          $userName = 'gh-dns-smoke'
          Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          $plain = -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 28 | ForEach-Object { [char]$_ })
          $sec = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name $userName -Password $sec -AccountNeverExpires -PasswordNeverExpires `
            -UserMayNotChangePassword -ErrorAction Stop
          foreach ($g in @('DnsAdmins', 'DNSAdmins')) {
            $lg = Get-LocalGroup -Name $g -ErrorAction SilentlyContinue
            if ($lg) {
              Add-LocalGroupMember -Group $g -Member $userName -ErrorAction Stop
              break
            }
          }
          Add-LocalGroupMember -Group 'Remote Management Users' -Member $userName -ErrorAction Stop

          Import-Module DnsServer
          foreach ($z in @('local-smoke.test', 'local-denied.test')) {
            if (Get-DnsServerZone -Name $z -ErrorAction SilentlyContinue) {
              Remove-DnsServerZone -Name $z -Force
            }
            Add-DnsServerPrimaryZone -Name $z -ZoneFile "$z.dns" -ErrorAction Stop
          }

          Write-Output "::add-mask::$plain"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_WINRM_USER=$userName"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_WINRM_PASSWORD=$plain"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_ALLOWED_ZONE=local-smoke.test"
          Add-Content -Path $env:GITHUB_ENV -Value "LOCAL_DENIED_ZONE=local-denied.test"

      - name: Copy env example for testing
        run: cp .env.example .env

      - name: Generate encryption key for testing
        run: |
          KEY="$(python - <<'PY'
          import base64
          import os

          print(base64.urlsafe_b64encode(os.urandom(32)).decode())
          PY
          )"
          sed -i.bak "s|ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${KEY}|" .env
          rm -f .env.bak
          echo 'Generated encryption key for testing'

      - name: Install deps, start API (uvicorn), run Microsoft smoke
        env:
          REMOTE_WINRM_HOST: ${{ secrets.MICROSOFT_DNS_WINRM_HOST }}
          REMOTE_WINRM_USER: ${{ secrets.MICROSOFT_DNS_WINRM_USER }}
          REMOTE_WINRM_PASSWORD: ${{ secrets.MICROSOFT_DNS_WINRM_PASSWORD }}
          REMOTE_WINRM_SSL: ${{ secrets.MICROSOFT_DNS_WINRM_SSL }}
          REMOTE_QUERY_HOST: ${{ secrets.MICROSOFT_DNS_QUERY_HOST }}
          REMOTE_ALLOWED_ZONE: ${{ github.event.inputs.allowed_zone }}
          REMOTE_DENIED_ZONE: ${{ github.event.inputs.denied_zone }}
          INPUT_QUERY_SERVER: ${{ github.event.inputs.dns_query_server }}
        run: |
          set -euo pipefail

          cleanup() {
            if [ -f /tmp/uvicorn.pid ]; then
              kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
              rm -f /tmp/uvicorn.pid
            fi
          }
          trap cleanup EXIT

          python -m venv .venv
          # shellcheck source=/dev/null
          source .venv/Scripts/activate
          pip install -q -r requirements.txt

          echo "Starting uvicorn (native Windows Python; WinRM to 127.0.0.1 for local DNS)..."
          uvicorn src.app:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/login >/dev/null; then
              break
            fi
            if ! kill -0 "$(cat /tmp/uvicorn.pid)" 2>/dev/null; then
              echo "uvicorn exited early"
              cat /tmp/uvicorn.log || true
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent -c /tmp/cookies -X POST http://127.0.0.1:8000/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin&password=your-admin-password" \
            -o /dev/null
          curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/admin \
            | python -c "import sys; assert 'DNS Admin Dashboard' in sys.stdin.read()"

          call_dns_api() {
            local api_key="$1"
            local expected_status="$2"
            local expected_action="$3"
            local body="$4"
            local output="/tmp/dns-response-${expected_action}-$$.json"
            local status

            status="$(curl --silent --show-error -o "${output}" -w "%{http_code}" \
              -X POST http://127.0.0.1:8000/dns-record \
              -H "Content-Type: application/json" \
              -H "X-API-Key: ${api_key}" \
              -d "${body}")"

            echo "${expected_action}: HTTP ${status}"
            cat "${output}"
            echo

            if [ "${status}" != "${expected_status}" ]; then
              echo "Expected HTTP ${expected_status}, got ${status}"
              exit 1
            fi

            python -c "import json,sys;b=json.load(open(sys.argv[1],encoding='utf-8'));e=sys.argv[2];assert((e=='access_denied' and b['detail']['error']=='access_denied') or (b['action']==e)),b" "${output}" "${expected_action}"
          }

          LOCAL_WINRM_TARGET="127.0.0.1"
          LOCAL_DIG_SERVER="127.0.0.1"
          resolve_a_local() {
            export CHECK_FQDN="$1"
            export CHECK_SERVER="$2"
            POWERSHELL_TELEMETRY_OPTOUT=1 pwsh -NoProfile -Command \
              '$r = Resolve-DnsName -Name $env:CHECK_FQDN -Type A -DnsOnly -Server $env:CHECK_SERVER -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress } | Select-Object -First 1
              if ($null -eq $r) { "" } else { $r.IPAddress }' | tr -d '\r'
          }

          wait_local_a() {
            local fqdn="$1"
            local expected="$2"
            local value=""
            for i in $(seq 1 30); do
              value="$(resolve_a_local "${fqdn}" "${LOCAL_DIG_SERVER}" | tail -n 1 || true)"
              if [ "${value}" = "${expected}" ]; then
                return 0
              fi
              sleep 2
            done
            echo "Expected ${fqdn} on local Microsoft DNS to resolve to ${expected}; got '${value}'"
            exit 1
          }

          wait_local_absent() {
            local fqdn="$1"
            local value=""
            for i in $(seq 1 30); do
              value="$(resolve_a_local "${fqdn}" "${LOCAL_DIG_SERVER}" | tail -n 1 || true)"
              if [ -z "${value}" ]; then
                return 0
              fi
              sleep 2
            done
            echo "Expected ${fqdn} absent on local Microsoft DNS; got '${value}'"
            exit 1
          }

          echo "=== Local Microsoft DNS (WinRM -> ${LOCAL_WINRM_TARGET}) ==="
          LOCAL_USER_PRINCIPAL=".\\${LOCAL_WINRM_USER}"
          for zone in "${LOCAL_ALLOWED_ZONE}" "${LOCAL_DENIED_ZONE}"; do
            curl --fail --silent -b /tmp/cookies -X POST http://127.0.0.1:8000/zones \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "zone_name=${zone}" \
              --data-urlencode "dns_provider_type=microsoft" \
              --data-urlencode "dns_server=${LOCAL_WINRM_TARGET}" \
              --data-urlencode "dns_username=${LOCAL_USER_PRINCIPAL}" \
              --data-urlencode "dns_password=${LOCAL_WINRM_PASSWORD}" \
              -o /dev/null
          done

          curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/api-keys -o /tmp/api-keys.html
          LOCAL_ZONE_ID="$(LOCAL_ALLOWED_ZONE="${LOCAL_ALLOWED_ZONE}" python - <<'PY'
          import os
          import re

          html = open("/tmp/api-keys.html", encoding="utf-8").read()
          zone = os.environ["LOCAL_ALLOWED_ZONE"]
          escaped = re.escape(zone)
          match = re.search(
              r'name="zone_ids" value="(\d+)"\s*/>\s*<code>' + escaped + r"</code>",
              html,
              re.DOTALL,
          )
          if not match:
              raise SystemExit(f"Could not find zone ID for {zone!r}")
          print(match.group(1))
          PY
          )"

          curl --fail --silent -L -b /tmp/cookies -X POST http://127.0.0.1:8000/api-keys \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "label=ms-local-smoke" \
            --data-urlencode "zone_ids=${LOCAL_ZONE_ID}" \
            -o /tmp/api-key-ms-local.html

          MS_LOCAL_KEY="$(python - <<'PY'
          import re

          html = open("/tmp/api-key-ms-local.html", encoding="utf-8").read()
          match = re.search(r"API key created:\s*([^<\s]+)", html)
          if not match:
              raise SystemExit("Could not extract local Microsoft API key")
          print(match.group(1))
          PY
          )"

          curl --fail --silent -H "X-API-Key: ${MS_LOCAL_KEY}" http://127.0.0.1:8000/keycheck \
            | python -c "import json, sys; assert json.load(sys.stdin)['status'] == 'success'"

          L_CREATE="$(LOCAL_ALLOWED_ZONE="${LOCAL_ALLOWED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["LOCAL_ALLOWED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "A", "record_name": "www", "ttl": 300, "values": ["192.0.2.10"]}))
          PY
          )"
          L_UPDATE="$(LOCAL_ALLOWED_ZONE="${LOCAL_ALLOWED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["LOCAL_ALLOWED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "A", "record_name": "www", "ttl": 300, "values": ["192.0.2.20"]}))
          PY
          )"
          L_DELETE="$(LOCAL_ALLOWED_ZONE="${LOCAL_ALLOWED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["LOCAL_ALLOWED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "DELETE", "record_name": "www", "values": ["A"]}))
          PY
          )"
          L_DENIED="$(LOCAL_DENIED_ZONE="${LOCAL_DENIED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["LOCAL_DENIED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "A", "record_name": "blocked", "ttl": 300, "values": ["192.0.2.55"]}))
          PY
          )"

          L_WWW="www.${LOCAL_ALLOWED_ZONE}"
          call_dns_api "${MS_LOCAL_KEY}" 200 created "${L_CREATE}"
          wait_local_a "${L_WWW}" 192.0.2.10
          call_dns_api "${MS_LOCAL_KEY}" 200 updated "${L_UPDATE}"
          wait_local_a "${L_WWW}" 192.0.2.20
          call_dns_api "${MS_LOCAL_KEY}" 200 deleted "${L_DELETE}"
          wait_local_absent "${L_WWW}"
          call_dns_api "${MS_LOCAL_KEY}" 404 not_found "${L_DELETE}"
          call_dns_api "${MS_LOCAL_KEY}" 403 access_denied "${L_DENIED}"

          if [ -n "${REMOTE_WINRM_HOST:-}" ] && [ -n "${REMOTE_WINRM_USER:-}" ] && [ -n "${REMOTE_WINRM_PASSWORD:-}" ]; then
            echo "=== Remote Microsoft DNS (secrets) ==="
            REMOTE_CURL_SSL=()
            if [ "${REMOTE_WINRM_SSL:-}" = "true" ] || [ "${REMOTE_WINRM_SSL:-}" = "True" ] || [ "${REMOTE_WINRM_SSL:-}" = "1" ]; then
              REMOTE_CURL_SSL=(--data-urlencode "dns_winrm_ssl=true")
            fi
            REMOTE_DIG="${INPUT_QUERY_SERVER:-}"
            if [ -z "${REMOTE_DIG}" ]; then
              REMOTE_DIG="${REMOTE_QUERY_HOST:-}"
            fi

            resolve_a_remote() {
              export CHECK_FQDN="$1"
              export CHECK_SERVER="$2"
              POWERSHELL_TELEMETRY_OPTOUT=1 pwsh -NoProfile -Command \
                '$r = Resolve-DnsName -Name $env:CHECK_FQDN -Type A -DnsOnly -Server $env:CHECK_SERVER -ErrorAction SilentlyContinue |
                  Where-Object { $_.IPAddress } | Select-Object -First 1
                if ($null -eq $r) { "" } else { $r.IPAddress }' | tr -d '\r'
            }

            wait_remote_a() {
              local fqdn="$1"
              local expected="$2"
              local value=""
              if [ -z "${REMOTE_DIG}" ]; then
                return 0
              fi
              for i in $(seq 1 30); do
                value="$(resolve_a_remote "${fqdn}" "${REMOTE_DIG}" | tail -n 1 || true)"
                if [ "${value}" = "${expected}" ]; then
                  return 0
                fi
                sleep 2
              done
              echo "Expected ${fqdn} to resolve to ${expected} via ${REMOTE_DIG}; got '${value}'"
              exit 1
            }

            wait_remote_absent() {
              local fqdn="$1"
              local value=""
              if [ -z "${REMOTE_DIG}" ]; then
                return 0
              fi
              for i in $(seq 1 30); do
                value="$(resolve_a_remote "${fqdn}" "${REMOTE_DIG}" | tail -n 1 || true)"
                if [ -z "${value}" ]; then
                  return 0
                fi
                sleep 2
              done
              echo "Expected ${fqdn} absent at ${REMOTE_DIG}; got '${value}'"
              exit 1
            }

            for zone in "${REMOTE_ALLOWED_ZONE}" "${REMOTE_DENIED_ZONE}"; do
              curl --fail --silent -b /tmp/cookies -X POST http://127.0.0.1:8000/zones \
                -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "zone_name=${zone}" \
                --data-urlencode "dns_provider_type=microsoft" \
                --data-urlencode "dns_server=${REMOTE_WINRM_HOST}" \
                --data-urlencode "dns_username=${REMOTE_WINRM_USER}" \
                --data-urlencode "dns_password=${REMOTE_WINRM_PASSWORD}" \
                "${REMOTE_CURL_SSL[@]}" \
                -o /dev/null
            done

            curl --fail --silent -b /tmp/cookies http://127.0.0.1:8000/api-keys -o /tmp/api-keys-remote.html
            R_ZONE_ID="$(REMOTE_ALLOWED_ZONE="${REMOTE_ALLOWED_ZONE}" python - <<'PY'
          import os
          import re

          html = open("/tmp/api-keys-remote.html", encoding="utf-8").read()
          zone = os.environ["REMOTE_ALLOWED_ZONE"]
          escaped = re.escape(zone)
          match = re.search(
              r'name="zone_ids" value="(\d+)"\s*/>\s*<code>' + escaped + r"</code>",
              html,
              re.DOTALL,
          )
          if not match:
              raise SystemExit(f"Could not find remote zone ID for {zone!r}")
          print(match.group(1))
          PY
          )"

            curl --fail --silent -L -b /tmp/cookies -X POST http://127.0.0.1:8000/api-keys \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "label=ms-remote-smoke" \
              --data-urlencode "zone_ids=${R_ZONE_ID}" \
              -o /tmp/api-key-ms-remote.html

            MS_REMOTE_KEY="$(python - <<'PY'
          import re

          html = open("/tmp/api-key-ms-remote.html", encoding="utf-8").read()
          match = re.search(r"API key created:\s*([^<\s]+)", html)
          if not match:
              raise SystemExit("Could not extract remote Microsoft API key")
          print(match.group(1))
          PY
          )"

            R_CREATE="$(REMOTE_ALLOWED_ZONE="${REMOTE_ALLOWED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["REMOTE_ALLOWED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "A", "record_name": "www", "ttl": 300, "values": ["192.0.2.10"]}))
          PY
          )"
            R_UPDATE="$(REMOTE_ALLOWED_ZONE="${REMOTE_ALLOWED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["REMOTE_ALLOWED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "A", "record_name": "www", "ttl": 300, "values": ["192.0.2.20"]}))
          PY
          )"
            R_DELETE="$(REMOTE_ALLOWED_ZONE="${REMOTE_ALLOWED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["REMOTE_ALLOWED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "DELETE", "record_name": "www", "values": ["A"]}))
          PY
          )"
            R_DENIED="$(REMOTE_DENIED_ZONE="${REMOTE_DENIED_ZONE}" python - <<'PY'
          import json, os
          z = os.environ["REMOTE_DENIED_ZONE"]
          print(json.dumps({"zone_name": z, "record_type": "A", "record_name": "blocked", "ttl": 300, "values": ["192.0.2.55"]}))
          PY
          )"

            R_WWW="www.${REMOTE_ALLOWED_ZONE}"
            call_dns_api "${MS_REMOTE_KEY}" 200 created "${R_CREATE}"
            wait_remote_a "${R_WWW}" 192.0.2.10
            call_dns_api "${MS_REMOTE_KEY}" 200 updated "${R_UPDATE}"
            wait_remote_a "${R_WWW}" 192.0.2.20
            call_dns_api "${MS_REMOTE_KEY}" 200 deleted "${R_DELETE}"
            wait_remote_absent "${R_WWW}"
            call_dns_api "${MS_REMOTE_KEY}" 404 not_found "${R_DELETE}"
            call_dns_api "${MS_REMOTE_KEY}" 403 access_denied "${R_DENIED}"
          else
            echo "=== Remote Microsoft DNS skipped (set MICROSOFT_DNS_WINRM_* secrets to enable) ==="
          fi

          echo "Microsoft smoke on Windows completed successfully."
