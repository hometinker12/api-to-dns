<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DNS Admin Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>DNS Admin Dashboard</h1>
        <p class="help">Signed in as {{ user }}</p>
      </div>
      <nav class="nav-links">        
        <a class="button danger" href="/logout">Logout</a>
      </nav>
    </header>
    <nav class="nav-links">
        <a class="button" href="/dns-zones">DNS Zones</a>
      <a class="button" href="/api-keys">API Keys</a>
      <a class="button" href="/docs#/">API Docs</a>
    </nav>
    <section>
      <h2>DNS zones</h2>
      {% if zones %}
        <ul class="summary-list">
          {% for z in zones %}
            <li>
              <code>{{ z.zone_name }}</code>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>No zones configured.</p>
      {% endif %}
    </section>
  </div>
</body>
</html>
