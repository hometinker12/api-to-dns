services:
  dns-api:
    image: hometinker12/api-to-dns:0.8.0
    build: .
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,mode=1777
    ports:
      - "8001:8000"
      - "8443:8443"
    # Secrets and optional knobs come from .env (copy from .env.example).
    # Do not duplicate live values here — Compose environment: below only
    # overrides paths/ports that must differ inside the container.
    #
    # Required in .env:
    #   SECRET_KEY=...
    #   ENCRYPTION_KEY=...
    #   ADMIN_USER=admin
    #   ADMIN_PASSWORD=...
    #
    # Optional in .env (defaults shown; see .env.example for full notes):
    #   SSL_ENABLED=0
    #   LETSENCRYPT_RENEW_DAYS=30
    #   LETSENCRYPT_STAGING=0
    #   TZ=America/New_York
    #   CORS_ORIGINS=https://admin.example.com,https://app.example.com
    #   SESSION_COOKIE_SECURE=1
    #   TRUST_PROXY_HEADERS=0
    #   OPENAPI_ENABLED=0
    #   DEBUG_ERRORS=0
    #   RATE_LIMIT_LOGIN=20:60
    #   RATE_LIMIT_KEYCHECK=60:60
    #   RATE_LIMIT_DNS_RECORD=180:60
    #   API_TO_DNS_DISABLE_RATE_LIMIT=1
    env_file:
      - .env
    environment:
      # Container paths (win over .env when both set). Local/non-Docker
      # .env.example uses ./data/... instead.
      DATABASE_URL: sqlite:////app/data/app.db
      LOG_FILE: /app/logs/api-to-dns.log
      APP_SSL_DIR: /app/data/ssl
      HTTP_PORT: "8000"
      TLS_PORT: "8443"
    volumes:
      - api-to-dns-data:/app/data
      - api-to-dns-ssl:/app/data/ssl
      - api-to-dns-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.ssl_certs", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  api-to-dns-data:
  api-to-dns-ssl:
  api-to-dns-logs:
