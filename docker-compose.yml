version: '3.9'

services:
  dns-api:
    image: hometinker12/api-to-dns:latest
    build: .
    ports:
      - "8001:8000"
      - "8443:8443"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      LOG_FILE: /app/logs/api-to-dns.log
      APP_SSL_DIR: /app/data/ssl
      HTTP_PORT: "8000"
      TLS_PORT: "8443"
    volumes:
      - api-to-dns-data:/app/data
      - api-to-dns-ssl:/app/data/ssl
      - api-to-dns-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "src.ssl_certs", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  api-to-dns-data:
  api-to-dns-ssl:
  api-to-dns-logs:
